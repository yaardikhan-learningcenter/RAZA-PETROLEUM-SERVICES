<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<script src="config.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raza Petroleum Services — ERP</title>
<style>
:root{
  --bg:#f4f6f9; --panel:#ffffff; --ink:#16212e; --ink-soft:#5b6b7c;
  --border:#e3e8ee; --border-soft:#eef1f5;
  --brand:#0f5f4e; --brand-dark:#0b4a3d; --brand-light:#e6f3ef;
  --accent:#c8862a; --accent-light:#fbf0dd;
  --red:#b3413a; --red-light:#fbeae8;
  --blue:#2b6ca3; --blue-light:#e8f1f9;
  --purple:#6a4d9c; --purple-light:#f0ebf8;
  --sidebar-w:250px; --topbar-h:60px;
  --radius:10px; --radius-sm:6px;
  --shadow:0 1px 3px rgba(16,24,40,0.06), 0 1px 2px rgba(16,24,40,0.04);
  --shadow-md:0 4px 14px rgba(16,24,40,0.09);
  font-size:15px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
}
::selection{background:#bfe3d8;}
a{color:inherit;}
button{font-family:inherit;}
table{border-collapse:collapse;}
input,select,textarea{font-family:inherit; font-size:14px;}

/* ---------- Layout ---------- */
#app{display:flex; min-height:100vh;}
#sidebar{
  width:var(--sidebar-w); background:linear-gradient(180deg,#0d3f34,#0a2e27); color:#eaf3f0;
  position:fixed; top:0; left:0; bottom:0; overflow-y:auto; z-index:40;
  transition:transform .25s ease;
}
#sidebar .brand{
  display:flex; align-items:center; gap:10px; padding:18px 18px 14px 18px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
#sidebar .brand .logo{
  width:38px;height:38px;border-radius:9px;background:rgba(255,255,255,0.12);
  display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;
}
#sidebar .brand .name{font-weight:700; font-size:14.5px; line-height:1.25;}
#sidebar .brand .sub{font-size:11px; opacity:.65; margin-top:1px;}
.nav-group{padding:10px 10px 4px 10px;}
.nav-group-title{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; opacity:.5;
  padding:12px 10px 6px 10px; font-weight:700;
}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px;
  cursor:pointer; font-size:13.6px; color:#d9ece6; margin:1px 0; user-select:none;
  white-space:nowrap;
}
.nav-item .ic{width:18px; text-align:center; flex:none; font-size:14px;}
.nav-item:hover{background:rgba(255,255,255,0.08);}
.nav-item.active{background:#ffffff; color:var(--brand-dark); font-weight:700;}
#sidebar-footer{padding:14px; font-size:10.5px; opacity:.45; border-top:1px solid rgba(255,255,255,0.08); margin-top:6px;}

#main-wrap{margin-left:var(--sidebar-w); flex:1; min-width:0; display:flex; flex-direction:column;}
#topbar{
  height:var(--topbar-h); background:var(--panel); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; padding:0 22px;
  position:sticky; top:0; z-index:30; gap:14px;
}
#topbar .page-title{font-size:17px; font-weight:700; display:flex; align-items:center; gap:8px;}
#topbar .page-sub{font-size:12px; color:var(--ink-soft); font-weight:500;}
#menu-toggle{display:none; background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink);}
.topbar-actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end;}

#content{padding:22px; flex:1; min-width:0;}
.page{display:none; animation:fadein .18s ease;}
.page.active{display:block;}
@keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

/* ---------- Common bits ---------- */
.card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);}
.card-pad{padding:18px 20px;}
.card-head{display:flex; align-items:center; justify-content:space-between; padding:15px 20px; border-bottom:1px solid var(--border-soft); flex-wrap:wrap; gap:10px;}
.card-head h3{margin:0; font-size:14.5px; font-weight:700;}
.card-head .hint{font-size:11.5px; color:var(--ink-soft); font-weight:500; margin-top:1px;}
.grid{display:grid; gap:16px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:1000px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr;}}
@media (max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

.kpi{padding:16px 18px; border-radius:var(--radius); position:relative; overflow:hidden;}
.kpi .label{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; opacity:.75;}
.kpi .value{font-size:23px; font-weight:800; margin-top:6px; letter-spacing:-.02em;}
.kpi .sub{font-size:11.5px; margin-top:5px; opacity:.8; font-weight:600;}
.kpi.green{background:var(--brand-light); color:var(--brand-dark);}
.kpi.amber{background:var(--accent-light); color:#7a5417;}
.kpi.blue{background:var(--blue-light); color:#1d4d73;}
.kpi.red{background:var(--red-light); color:#7c2c26;}
.kpi.purple{background:var(--purple-light); color:#4a3670;}

.btn{
  border:1px solid var(--border); background:#fff; color:var(--ink); padding:8px 14px;
  border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; display:inline-flex;
  align-items:center; gap:6px; transition:.12s; white-space:nowrap;
}
.btn:hover{background:#f6f8fa; border-color:#d5dbe2;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--brand); border-color:var(--brand); color:#fff;}
.btn-primary:hover{background:var(--brand-dark); border-color:var(--brand-dark);}
.btn-accent{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn-accent:hover{filter:brightness(0.94);}
.btn-danger{background:#fff; color:var(--red); border-color:#eecdc9;}
.btn-danger:hover{background:var(--red-light);}
.btn-sm{padding:5px 9px; font-size:12px; border-radius:6px;}
.btn-icon{padding:7px 9px;}
.btn[disabled]{opacity:.5; cursor:not-allowed;}

.badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:99px;}
.badge.green{background:var(--brand-light); color:var(--brand-dark);}
.badge.red{background:var(--red-light); color:var(--red);}
.badge.amber{background:var(--accent-light); color:#7a5417;}
.badge.gray{background:#eef1f5; color:var(--ink-soft);}
.badge.blue{background:var(--blue-light); color:#1d4d73;}

table.tbl{width:100%; border-collapse:collapse; font-size:13px;}
table.tbl th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em;
  color:var(--ink-soft); padding:9px 12px; border-bottom:2px solid var(--border); white-space:nowrap; font-weight:700;
}
table.tbl td{padding:9px 12px; border-bottom:1px solid var(--border-soft); white-space:nowrap;}
table.tbl tbody tr:hover{background:#fafbfc;}
table.tbl tfoot td{font-weight:700; border-top:2px solid var(--border); border-bottom:none; background:#fafbfc;}
.tbl-wrap{overflow-x:auto; border-radius:0 0 var(--radius) var(--radius);}
.num{text-align:right; font-variant-numeric:tabular-nums;}
.muted{color:var(--ink-soft);}
.right{text-align:right;}
.center{text-align:center;}
.row-actions{display:flex; gap:6px;}
.empty-row td{text-align:center; padding:34px 12px; color:var(--ink-soft); font-size:13px;}

.field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px;}
.field label{font-size:12px; font-weight:700; color:var(--ink-soft);}
.field input, .field select, .field textarea{
  padding:9px 11px; border:1px solid var(--border); border-radius:8px; background:#fff; color:var(--ink);
  outline:none; width:100%;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-light);}
.field .helptext{font-size:11px; color:var(--ink-soft);}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media (max-width:560px){.field-row{grid-template-columns:1fr;}}

.tabs{display:flex; gap:2px; padding:4px; background:#eef1f5; border-radius:9px; width:fit-content; margin-bottom:16px; flex-wrap:wrap;}
.tab-btn{padding:7px 15px; border-radius:7px; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--ink-soft); background:transparent; border:none;}
.tab-btn.active{background:#fff; color:var(--ink); box-shadow:var(--shadow);}

/* modal */
#modal-backdrop{position:fixed; inset:0; background:rgba(15,25,35,.45); display:none; align-items:flex-start; justify-content:center; z-index:100; overflow-y:auto; padding:40px 16px;}
#modal-backdrop.show{display:flex;}
.modal{background:#fff; border-radius:var(--radius); width:100%; max-width:520px; box-shadow:var(--shadow-md); animation:modalin .15s ease;}
.modal.wide{max-width:720px;}
@keyframes modalin{from{opacity:0; transform:translateY(-8px) scale(.98);} to{opacity:1; transform:none;}}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border-soft);}
.modal-head h3{margin:0; font-size:15.5px;}
.modal-close{background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink-soft); line-height:1;}
.modal-body{padding:18px 20px; max-height:70vh; overflow-y:auto;}
.modal-foot{display:flex; justify-content:flex-end; gap:8px; padding:14px 20px; border-top:1px solid var(--border-soft);}

/* toast */
#toast-wrap{position:fixed; bottom:18px; right:18px; z-index:200; display:flex; flex-direction:column; gap:8px;}
.toast{background:var(--ink); color:#fff; padding:11px 16px; border-radius:9px; font-size:13px; font-weight:600; box-shadow:var(--shadow-md); display:flex; align-items:center; gap:8px; animation:toastin .18s ease; max-width:340px;}
.toast.ok{background:var(--brand-dark);}
.toast.err{background:var(--red);}
.toast.warn{background:#8a6414;}
@keyframes toastin{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

.save-pill{display:flex; align-items:center; gap:7px; font-size:12px; font-weight:700; padding:7px 12px; border-radius:99px; background:#eef1f5; color:var(--ink-soft); cursor:pointer; border:1px solid var(--border);}
.save-pill .dot{width:8px; height:8px; border-radius:99px; background:#9aa5b1;}
.save-pill.connected{background:var(--brand-light); color:var(--brand-dark); border-color:transparent;}
.save-pill.connected .dot{background:var(--brand); box-shadow:0 0 0 3px var(--brand-light);}
.save-pill.saving .dot{background:var(--accent); animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.35;}}

.section-title{font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin:22px 0 10px 0;}
.section-title:first-child{margin-top:0;}
.chart-legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:10px; font-size:11.5px; color:var(--ink-soft);}
.chart-legend span{display:inline-flex; align-items:center; gap:5px;}
.chart-legend i{width:10px; height:10px; border-radius:3px; display:inline-block;}
.small-note{font-size:11.5px; color:var(--ink-soft); line-height:1.5;}
.link-btn{background:none;border:none;color:var(--brand);font-weight:700;cursor:pointer;font-size:12.5px;padding:0;}
.link-btn:hover{text-decoration:underline;}
.pill-select{display:flex; gap:6px; flex-wrap:wrap;}
.pill-select button{padding:6px 12px; border-radius:99px; border:1px solid var(--border); background:#fff; font-size:12px; font-weight:700; cursor:pointer; color:var(--ink-soft);}
.pill-select button.active{background:var(--brand); border-color:var(--brand); color:#fff;}
#overlay-scrim{position:fixed; inset:0; background:rgba(10,15,20,.4); z-index:35; display:none;}
@media (max-width:900px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #main-wrap{margin-left:0;}
  #menu-toggle{display:block;}
  #overlay-scrim.show{display:block;}
  .grid-4{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="logo">⛽</div>
      <div>
        <div class="name" id="brand-name">RAZA PETROLEUM SERVICES</div>

      </div>
    </div>
    <nav id="nav"></nav>
    <div id="sidebar-footer">Fully offline · single-file ERP</div>

  <div id="overlay-scrim" onclick="closeSidebar()"></div>

    <div id="content"></div>
  </div>
</div>

/* Linear interpolation over a sorted [x,y] calibration table */
function interpolateTable(table, x){
  if(!table || !table.length) return 0;
  x = Number(x)||0;
  if(x <= table[0][0]) return table[0][1] * (x/ (table[0][0]||1)) ; // below first point, scale from origin (0,0)
  if(x >= table[table.length-1][0]) return table[table.length-1][1];
  // binary search
  let lo=0, hi=table.length-1;
  while(hi-lo>1){
    const mid=(lo+hi)>>1;
    if(table[mid][0] <= x) lo=mid; else hi=mid;
  }
  const [x0,y0]=table[lo], [x1,y1]=table[hi];
  if(x1===x0) return y0;
  return y0 + (y1-y0) * (x-x0)/(x1-x0);
}

  const i = DB.tx[key].findIndex(r=>r.id===id);

/* =========================================================

function serializeCurrentHTML(){
  const jsonStr = JSON.stringify(DB);
  const re = /(<script id="app-data" type="application\/json">)([\s\S]*?)(<\/script>)/;
  const newHtml = RAW_HTML_TEMPLATE.replace(re, (m,p1,p2,p3)=> p1 + jsonStr + p3);
  return '<!DOCTYPE html>\n' + newHtml;
}

function fsaSupported(){ return typeof window.showOpenFilePicker === 'function'; }

async function connectFile(){
  if(!fsaSupported()){
    toast('Automatic saving needs a Chromium browser (Chrome/Edge) on desktop. Use Backup & Restore to save manually instead.', 'warn');
    return;
  }
  try{
    const [handle] = await window.showOpenFilePicker({
      types: [{description:'ERP HTML file', accept:{'text/html':['.html','.htm']}}],
      excludeAcceptAllOption:false,
      multiple:false
    });
    let perm = await handle.queryPermission({mode:'readwrite'});
    if(perm !== 'granted'){
      perm = await handle.requestPermission({mode:'readwrite'});
    }
    if(perm !== 'granted'){ toast('Write permission was not granted.', 'err'); return; }
    fileHandle = handle;
    updateSavePill();
    await writeToConnectedFile(true);
    toast('Auto-save is ON. Every change now saves straight into this file.', 'ok');
  }catch(err){
    if(err.name !== 'AbortError') toast('Could not connect: '+err.message, 'err');
  }
}

async function writeToConnectedFile(silent){
  if(!fileHandle) return;
  try{
    updateSavePill('saving');
    const writable = await fileHandle.createWritable();
    await writable.write(serializeCurrentHTML());
    await writable.close();
    isDirty = false;
    updateSavePill();
    if(!silent) toast('Saved.', 'ok');
  }catch(err){
    updateSavePill();
    toast('Auto-save failed (' + err.message + '). Your data is still safe in this open tab — click Backup to download it now.', 'err');
  }
}

function disconnectFile(){
  fileHandle = null;

/* ---------- Nozzle sales (Diesel / Petrol) ---------- */
function nozzleKey(kind){ return kind==='diesel' ? 'nozzleDiesel' : 'nozzlePetrol'; }

function nozzleOpeningFor(kind, idx, beforeDate){
  const rows = sortByDate(DB.tx[nozzleKey(kind)]).filter(r=> r.date < beforeDate);
  if(rows.length) return Number(rows[rows.length-1].closings[idx])||0;
  return Number(DB.nozzles[kind][idx].opening)||0;
}
function computeNozzleRow(kind, entry){
  const opens = entry.closings.map((c,i)=> nozzleOpeningFor(kind, i, entry.date));
  const sales = entry.closings.map((c,i)=> Math.max(0, Number(c||0) - opens[i]));
  const totalLitres = sales.reduce((a,b)=>a+b,0);
  const rate = Number(entry.rate)||0;
  const amount = totalLitres * rate;
  const fd = entry.id ? fifoMap(kind)[entry.id] : null;
  const cogs = fd ? fd.cogs : totalLitres * fuelCostRate(kind, entry.date, entry);
  const costRate = totalLitres>0 ? cogs/totalLitres : fuelCostRate(kind, entry.date, entry);
  return {opens, sales, totalLitres, rate, costRate, amount, cogs};
}
function getFuelRate(kind, date){
  const rows = sortByDate(DB.tx[nozzleKey(kind)]).filter(r=> r.date <= date);
  if(rows.length) return Number(rows[rows.length-1].rate)||0;
  const all = sortByDate(DB.tx[nozzleKey(kind)]);
  if(all.length) return Number(all[0].rate)||0;
  return kind==='diesel' ? 280 : 275;
}
/* ---------- Fuel purchase (cost) rate ----------
   Priority: cost rate typed on that day's nozzle entry -> latest purchase rate on/before the date
   -> cost rate in Setup -> (sale rate - dealer margin) as a last resort. */
function latestPurchaseRate(kind, date){
  const label = kind==='diesel'?'Diesel':'Petrol';
  const rows = sortByDate(DB.tx.purchases.filter(r=> r.product===label && r.date<=date && Number(r.rate)>0));
  return rows.length ? Number(rows[rows.length-1].rate) : 0;
}
function fuelCostRate(kind, date, entry){
  if(entry && Number(entry.costRate)>0) return Number(entry.costRate);
  const p = latestPurchaseRate(kind, date);
  if(p>0) return p;
  const c = Number(DB.fuel[kind].costRate)||0;
  if(c>0) return c;
  return Math.max(0, getFuelRate(kind, date) - (Number(DB.fuel[kind].margin)||0));
}
function nozzleSaleAmount(kind, date){
  const row = DB.tx[nozzleKey(kind)].find(r=>r.date===date);
  if(!row) return 0;
  return computeNozzleRow(kind,row).amount;
}
function cumulativeSalesLitres(kind, uptoDate){
  return DB.tx[nozzleKey(kind)].filter(r=> r.date <= uptoDate)
    .reduce((sum,r)=> sum + computeNozzleRow(kind,r).totalLitres, 0);
}
function cumulativePurchaseLitres(kind, uptoDate){
  const label = kind==='diesel'?'Diesel':'Petrol';

    .reduce((s,r)=>s+Number(r.qty||0),0);
}
function bookStock(kind, uptoDate){
  return Number(DB.fuel[kind].openingStock||0) + cumulativePurchaseLitres(kind,uptoDate) - cumulativeSalesLitres(kind,uptoDate);
}
function physicalStock(kind, dipMM){
  return interpolateTable(DB.calibration[kind], dipMM);
}
function computeDipRow(entry){
  const dieselPhysical = physicalStock('diesel', entry.dieselDip);
  const petrolPhysical = physicalStock('petrol', entry.petrolDip);
  const dieselBook = bookStock('diesel', entry.date);
  const petrolBook = bookStock('petrol', entry.date);
  return {
    dieselPhysical, dieselBook, dieselVariance: dieselPhysical-dieselBook,
    petrolPhysical, petrolBook, petrolVariance: petrolPhysical-petrolBook
  };
}
function latestDipOnOrBefore(kind, asOf){
  const rows = sortByDate(DB.tx.dip).filter(r=>r.date<=asOf);
  if(!rows.length) return null;
  const last = rows[rows.length-1];
  const mm = kind==='diesel'? last.dieselDip : last.petrolDip;
  return physicalStock(kind, mm);
}

function csGross(r){ return Number(r.qty||0)*Number(r.rate||0); }
function csDisc(r){ return Math.round((Number(r.qty||0)*Number(r.discPerUnit||0) + csGross(r)*Number(r.discPct||0)/100)*100)/100; }
function csNet(r){ return csGross(r) - csDisc(r); }
function creditSaleSumAll(date){

/* ---------- Calendar / date range helpers ---------- */
function allCalendarDates(){
  let maxDate = DB.meta.startDate;
  Object.values(DB.tx).forEach(arr=> arr.forEach(r=>{ if(r.date && r.date>maxDate) maxDate=r.date; }));
  const t = todayISO();
  if(t > maxDate) maxDate = t;
  const dates=[];
  let d = DB.meta.startDate;
  let guard=0;
  while(d <= maxDate && guard < 20000){ dates.push(d); d = addDaysISO(d,1); guard++; }
  return dates;
}

/* Fuel sales before this date are opening/baseline data and are not posted to cash */
function cashBooksActive(date){ return date >= (DB.meta.cashBooksStart || DB.meta.startDate); }

/* ---------- Bank deductions (charges on deposit / withdrawal) ---------- */
function dedOf(r){ return Number(r.dedAmt)||0; }
function calcDed(amount, pct){ return Math.round(Number(amount||0)*Number(pct||0))/100; }
function transferChargeMode(r){ return r.from!=='Cash' ? r.from : r.to; }
function deductionRows(start, end){
  const rows = [];
  const add = (src, r, who, mode)=>{
    const a = dedOf(r);
    if(a>0 && dateInRange(r.date,start,end)) rows.push({date:r.date, source:src, who, mode, pct:Number(r.dedPct)||0, base:Number(r.amount)||0, amount:a, _seq:r._seq});
  };
  DB.tx.receipts.forEach(r=>add('Deposit (receipt)', r, nameOf('customers',r.customerId), r.mode));
  DB.tx.payments.forEach(r=>add('Withdrawal (payment)', r, r.type==='Supplier Payment'?nameOf('suppliers',r.supplierId):(r.paidTo||'—'), r.mode));
  DB.tx.partnersLedger.forEach(r=>add(r.type==='Deposit'?'Deposit (partner)':'Withdrawal (partner)', r, nameOf('partners',r.partnerId), r.mode));
  DB.tx.fundTransfer.forEach(r=>add('Fund transfer', r, r.from+' → '+r.to, transferChargeMode(r)));
  return sortByDate(rows);
}
function dedSum(date){ return deductionRows(date,date).reduce((s,x)=>s+x.amount,0); }

/* ---------- Day Book ---------- */
function empSalaryPaidSum(date){ return DB.tx.employeeLedger.filter(r=>r.date===date && r.type==='Salary Paid').reduce((s,r)=>s+Number(r.amount||0),0); }
function empAdvanceGivenSum(date){ return DB.tx.employeeLedger.filter(r=>r.date===date && r.type==='Advance Given').reduce((s,r)=>s+Number(r.amount||0),0); }
function empAdvanceRecoveredSum(date){ return DB.tx.employeeLedger.filter(r=>r.date===date && r.type==='Advance Recovered').reduce((s,r)=>s+Number(r.amount||0),0); }
function empAdvanceNetSum(date){ return empAdvanceGivenSum(date) - empAdvanceRecoveredSum(date); }
function receiptsSum(date){ return DB.tx.receipts.filter(r=>r.date===date).reduce((s,r)=>s+Number(r.amount||0),0); }
function paymentsSum(date){ return DB.tx.payments.filter(r=>r.date===date).reduce((s,r)=>s+Number(r.amount||0),0); }
function expensesSum(date){ return DB.tx.expenses.filter(r=>r.date===date).reduce((s,r)=>s+Number(r.amount||0),0); }

function dayBookRange(start,end){
  const dates = allCalendarDates();
  const rows=[];
  let running = Number(DB.meta.openingCash)||0;
  for(const d of dates){
    const row = dayBookRow(d, running);
    running = row.closing;
    if(dateInRange(d,start,end)) rows.push(row);
  }
  return rows;
}
function dayBookAsOf(date){
  const dates = allCalendarDates().filter(d=>d<=date);
  let running = Number(DB.meta.openingCash)||0, row=null;
  for(const d of dates){ row = dayBookRow(d, running); running = row.closing; }
  return row;
}

/* ---------- Cash & Bank Ledger (mode aware) ---------- */
function cashBankLedgerRange(start,end){
  const dates = allCalendarDates();
  const modes = allModes();
  const running = {};
  running['Cash']=Number(DB.meta.openingCash)||0;
  DB.banks.forEach(b=> running[b.name]=Number(b.openingBalance)||0);
  const rows=[];
  for(const d of dates){
    const entry = {date:d, modes:{}};
    let total=0;
    modes.forEach(m=>{
      const opening = running[m]||0;
      const inn = modeInSum(m,d);
      const out = modeOutSum(m,d);
      const closing = opening+inn-out;
      entry.modes[m] = {opening,in:inn,out,closing};
      running[m]=closing;
      total += closing;
    });
    entry.total = total;
    if(dateInRange(d,start,end)) rows.push(entry);
  }
  return rows;
}
function currentBalances(){
  const rows = cashBankLedgerRange(null, todayISO());
  const last = rows.length? rows[rows.length-1] : null;
  const out = {};
  allModes().forEach(m=> out[m] = last? last.modes[m].closing : (m==='Cash'? Number(DB.meta.openingCash)||0 : (DB.banks.find(b=>b.name===m)||{}).openingBalance||0));
  out._total = last? last.total : Object.values(out).reduce((a,b)=>a+b,0);
  return out;
}

/* ---------- Customer / Supplier ledgers ---------- */
function customerTransactions(custId){
  const rows=[];
  DB.tx.creditSale.filter(r=>r.customerId===custId).forEach(r=>{
    rows.push({date:r.date, type:'Credit Sale', desc:creditSaleDesc(r), debit:csNet(r), credit:0, _seq:r._seq, ref:r});
  });
  DB.tx.receipts.filter(r=>r.customerId===custId).forEach(r=>{
    rows.push({date:r.date, type:'Receipt', desc:(r.narration||('Received via '+r.mode)), debit:0, credit:Number(r.amount||0), _seq:r._seq, ref:r});
  });
  return sortByDate(rows);
}
function customerBalance(custId, asOf){
  const cust = DB.customers.find(c=>c.id===custId);
  let bal = cust? Number(cust.openingBalance||0):0;
  customerTransactions(custId).forEach(r=>{ if(asOf && r.date>asOf) return; bal += r.debit - r.credit; });
  return bal;
}
function supplierBalance(supId, asOf){
  const sup = DB.suppliers.find(s=>s.id===supId);
  let bal = sup? Number(sup.openingBalance||0):0;
  supplierTransactions(supId).forEach(r=>{ if(asOf && r.date>asOf) return; bal += r.credit - r.debit; });
  return bal;
}
function allCustomerBalances(asOf){ return DB.customers.map(c=>({...c, balance: customerBalance(c.id, asOf)})); }
function allSupplierBalances(asOf){ return DB.suppliers.map(s=>({...s, balance: supplierBalance(s.id, asOf)})); }

/* ---------- Employees ---------- */
function employeeSummary(empId, asOf){
  const emp = DB.employees.find(e=>e.id===empId);
  const rows = DB.tx.employeeLedger.filter(r=>r.employeeId===empId && (!asOf || r.date<=asOf));
  const given = rows.filter(r=>r.type==='Advance Given').reduce((s,r)=>s+Number(r.amount||0),0);
  const recovered = rows.filter(r=>r.type==='Advance Recovered').reduce((s,r)=>s+Number(r.amount||0),0);
  const salaryPaid = rows.filter(r=>r.type==='Salary Paid').reduce((s,r)=>s+Number(r.amount||0),0);
  const closingAdvance = Number(emp.openingAdvance||0) + given - recovered;
  return {emp, given, recovered, salaryPaid, closingAdvance};
}

/* ---------- Stock Summary ---------- */
function stockSummary(asOf){
  const dieselBook = bookStock('diesel', asOf);
  const petrolBook = bookStock('petrol', asOf);
  const dieselPhysical = latestDipOnOrBefore('diesel', asOf);
  const petrolPhysical = latestDipOnOrBefore('petrol', asOf);
  const oils = DB.oils.map(o=>{
    const purchased = DB.tx.purchases.filter(r=>r.product===o.id && r.date<=asOf).reduce((s,r)=>s+Number(r.qty||0),0);
    const creditSold = DB.tx.creditSale.filter(r=>r.type==='Oil'&&r.product===o.id&&r.date<=asOf).reduce((s,r)=>s+Number(r.qty||0),0);
    const cashSold = DB.tx.cashOils.filter(r=>r.product===o.id&&r.date<=asOf).reduce((s,r)=>s+Number(r.qty||0),0);
    const closing = Number(o.openingStock||0) + purchased - creditSold - cashSold;
    return {...o, purchased, sold:creditSold+cashSold, closing, value: closing*Number(o.costRate||0), saleValue: closing*Number(o.saleRate||0)};
  });
  function fuel(kind, book, physical){
    const costRate = fuelCostRate(kind, asOf), saleRate = getFuelRate(kind, asOf);
    const fv = fifoClosingValue(kind, asOf); const avg = book>0 ? fv/book : costRate; return {book, physical, costRate: avg, saleRate, value: fv, saleValue: Math.max(0,book)*saleRate};
  }
  const diesel = fuel('diesel', dieselBook, dieselPhysical), petrol = fuel('petrol', petrolBook, petrolPhysical);
  const oilsCost = oils.reduce((a,o)=>a+o.value,0), oilsSale = oils.reduce((a,o)=>a+o.saleValue,0);
  return {
    diesel, petrol, oils, oilsCost, oilsSale,
    totalCost: diesel.value + petrol.value + oilsCost,
    totalSaleValue: diesel.saleValue + petrol.saleValue + oilsSale
  };
}

/* ---------- Profit & Loss ---------- */
function plForRange(start,end){
  const inRange = (d)=> dateInRange(d,start,end);
  let dieselRev=0,dieselCogs=0,dieselL=0, petrolRev=0,petrolCogs=0,petrolL=0;
  DB.tx.nozzleDiesel.filter(r=>inRange(r.date)).forEach(r=>{ const c=computeNozzleRow('diesel',r); dieselRev+=c.amount; dieselCogs+=c.cogs; dieselL+=c.totalLitres; });
  DB.tx.nozzlePetrol.filter(r=>inRange(r.date)).forEach(r=>{ const c=computeNozzleRow('petrol',r); petrolRev+=c.amount; petrolCogs+=c.cogs; petrolL+=c.totalLitres; });
  let oilsRev=0, oilsCogs=0;
  const oilMap = {};
  const addOil = (r)=>{
    const o = DB.oils.find(x=>x.id===r.product);
    const cr = Number(r.costRate)>0 ? Number(r.costRate) : (o? Number(o.costRate)||0 : 0);
    const m = oilMap[r.product] || (oilMap[r.product] = {name:productLabel(r.product), unit:productUnit(r.product), qty:0, sale:0, cost:0});
    const sale = r.qty*r.rate - (r.discPct||r.discPerUnit ? csDisc(r) : 0);
    m.qty += Number(r.qty)||0; m.sale += r.qty*r.rate; m.cost += r.qty*cr;
    oilsRev += r.qty*r.rate; oilsCogs += r.qty*cr;
  };
  DB.tx.cashOils.filter(r=>inRange(r.date)).forEach(addOil);
  DB.tx.creditSale.filter(r=>r.type==='Oil' && inRange(r.date)).forEach(addOil);
  const oilRows = Object.values(oilMap);
  const dieselCostRate = dieselL>0 ? dieselCogs/dieselL : fuelCostRate('diesel', end);
  const petrolCostRate = petrolL>0 ? petrolCogs/petrolL : fuelCostRate('petrol', end);
  const revenue = dieselRev+petrolRev+oilsRev;
  const cogs = dieselCogs+petrolCogs+oilsCogs;

  // discounts allowed to parties on credit sales
  let discount = 0; const discountRows = [];
  sortByDate(DB.tx.creditSale.filter(r=>inRange(r.date))).forEach(r=>{
    const d = csDisc(r);
    if(d>0){ discount += d; discountRows.push({date:r.date, customer:nameOf('customers',r.customerId), what:(r.type==='Oil'?productLabel(r.product):r.type), qty:r.qty, unit:productUnit(r.type==='Oil'?r.product:r.type), gross:csGross(r), amount:d}); }
  });
  const grossProfit = revenue - discount - cogs;

  const expenseRows = sortByDate(DB.tx.expenses.filter(r=>inRange(r.date)));
  const expenses = expenseRows.reduce((s,r)=>s+Number(r.amount||0),0);
  const salaryRows = sortByDate(DB.tx.employeeLedger.filter(r=>r.type==='Salary Paid'&&inRange(r.date)));
  const salaries = salaryRows.reduce((s,r)=>s+Number(r.amount||0),0);
  const bankRows = deductionRows(start,end);
  const bankCharges = bankRows.reduce((s,r)=>s+r.amount,0);
  const cardRows = cardFeeRows(start,end);
  const cardFees = cardRows.reduce((s,r)=>s+r.amount,0);
  const swapIncome = swapIncomeSum(start,end);
  const totalOpex = expenses + salaries + bankCharges + cardFees;
  const netProfit = grossProfit + swapIncome - totalOpex;

  const byHead = {};
  expenseRows.forEach(r=>{ byHead[r.head] = (byHead[r.head]||0) + Number(r.amount||0); });
  if(salaries>0) byHead['Employee Salaries (paid)'] = salaries;
  if(bankCharges>0) byHead['Bank Deductions'] = bankCharges;
  if(cardFees>0) byHead['Card / POS / Swap Charges'] = cardFees;

  const costWarnings = [];
  if(dieselL>0 && dieselCogs >= dieselRev-0.5) costWarnings.push('Diesel: purchase (cost) rate is not lower than the sale rate, so diesel profit shows zero.');
  if(petrolL>0 && petrolCogs >= petrolRev-0.5) costWarnings.push('Petrol: purchase (cost) rate is not lower than the sale rate, so petrol profit shows zero.');
  if(oilsRev>0 && oilsCogs >= oilsRev-0.5) costWarnings.push('Oils / Lubricants: cost rate is not lower than the sale rate, so oil profit shows zero.');

  return {dieselRev,dieselCogs,dieselL,petrolRev,petrolCogs,petrolL,oilsRev,oilsCogs,revenue,cogs,oilRows,dieselCostRate,petrolCostRate,
    discount,discountRows,grossProfit,cardRows,cardFees,swapIncome,expenses,expenseRows,salaries,salaryRows,bankCharges,bankRows,totalOpex,netProfit,byHead,costWarnings};
}

function openMasterForm(key, id){
  const def = MASTER_DEFS[key];

  def.fields.forEach(f=>{ if(row[f.key]===undefined) row[f.key]=f.type==='number'?0:''; });

    def.fields.map(f=>`<div class="field"><label>${f.label}</label><input id="m-${f.key}" type="${f.type==='number'?'number':'text'}" ${f.dp?`step="0.1"`:''} value="${esc(row[f.key])}"></div>`).join(''),

function submitMasterForm(key, id){
  const def = MASTER_DEFS[key];
  const obj={};
  let ok=true;
  def.fields.forEach(f=>{
    const raw = val('m-'+f.key);
    if(f.type==='number') obj[f.key]=Number(raw)||0; else obj[f.key]=raw.trim();
    if(f.key==='name' && !obj[f.key]) ok=false;
  });
  if(!ok){ toast('Name is required.','err'); return; }
  if(id) masterUpdate(key, id, obj); else masterAdd(key, obj, def.idPrefix);
  closeModal(); renderPage(); toast('Saved.','ok');
}
function deleteMasterRow(key, id){
  confirmDelete('Delete this entry? Historical records referencing it are kept as-is.', ()=>{ masterDelete(key, id); renderPage(); });
}

      <div class="field"><label>Sale Rate (Rs./L)</label><input type="number" step="0.01" id="m-rate" value="${rate}"></div>

function refreshNozzleOpenings(kind){
  const date = val('m-date');
  DB.nozzles[kind].forEach((n,i)=>{
    document.getElementById('m-open-'+i).value = nozzleOpeningFor(kind,i,date);
  });
  document.getElementById('m-rate').value = getFuelRate(kind, date);
  nozzleCostAuto(kind);
}
function nextSuggestedDate(key){
  const rows = sortByDate(DB.tx[key]);
  if(rows.length) return addDaysISO(rows[rows.length-1].date, 1);
  return DB.meta.startDate;
}
function submitNozzleForm(kind, id){
  const key = nozzleKey(kind);
  const date = val('m-date');
  if(!date){ toast('Date is required.','err'); return; }
  if(!id && DB.tx[key].some(r=>r.date===date)){ toast('An entry for this date already exists — edit it instead.','err'); return; }
  const closings = DB.nozzles[kind].map((n,i)=> Number(val('m-close-'+i))||0);
  const rate = numVal('m-rate');
  const costRate = numVal('m-cost');
  const obj = {date, closings, rate, costRate};
  if(costRate>=rate) toast('Warning: cost rate is not lower than the sale rate — profit will show zero.','warn');
  if(id) txUpdate(key, id, obj); else txAdd(key, obj);
  closeModal(); renderPage(); toast('Reading saved.','ok');
}

function tankCapacity(kind){ return Number(kind==='diesel'? DB.tanks.dieselCapacity : DB.tanks.petrolCapacity) || 25000; }
function tankDiaMM(){ return (Number(DB.tanks.diaFt)||8.08) * 304.8; }

/* inverse of the dip chart: litres -> dip (mm) */
function dipFromVolume(table, vol){
  if(!table || !table.length || vol<=0) return 0;
  const last = table[table.length-1];
  if(vol >= last[1]) return last[0];
  if(vol < table[0][1]) return table[0][0] * vol / table[0][1];
  for(let i=1;i<table.length;i++){
    if(table[i][1] >= vol){
      const [x0,y0]=table[i-1], [x1,y1]=table[i];
      return y1===y0 ? x0 : x0 + (x1-x0)*(vol-y0)/(y1-y0);
    }
  }
  return last[0];
}

/* current tank level: latest dip entry if there is one, otherwise book stock */
function tankLevel(kind){
  const table = DB.calibration[kind];
  const cap = tankCapacity(kind);
  const dips = sortByDate(DB.tx.dip);
  const last = dips.length ? dips[dips.length-1] : null;
  const book = bookStock(kind, todayISO());
  let litres, dipMM, source;
  const lastDip = last ? (Number(kind==='diesel'? last.dieselDip : last.petrolDip) || 0) : 0;
  if(last && lastDip > 0){
    dipMM = lastDip;
    litres = physicalStock(kind, dipMM);
    source = 'Dip reading of ' + fmtDate(last.date);
  } else {
    litres = Math.max(0, book);
    dipMM = dipFromVolume(table, litres);
    source = 'Book stock (no dip entered yet)';
  }
  return {litres, dipMM, source, book, cap, pct: cap? Math.max(0,Math.min(100, litres/cap*100)) : 0, hasDip: !!(last && lastDip > 0)};
}

/* cross-section of the horizontal tank showing the liquid level */
function svgTankGauge(kind, dipMM){
  const m = TANK_META[kind];
  const size = 150, r = 66, cx = size/2, cy = size/2;
  const frac = Math.max(0, Math.min(1, dipMM / tankDiaMM()));
  const levelY = cy + r - frac*2*r;
  const id = 'tg-'+kind;
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px; height:${size}px; flex:none;" role="img" aria-label="${m.short} tank liquid level ${Math.round(frac*100)}% of diameter">
    <defs><clipPath id="${id}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath></defs>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#f6f8fa"/>
    <rect x="0" y="${levelY.toFixed(1)}" width="${size}" height="${size}" fill="${m.color}" opacity="0.85" clip-path="url(#${id})"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#9aa5b1" stroke-width="3"/>
    <text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="15" font-weight="800" fill="${frac>0.5?'#fff':'#16212e'}">${Math.round(frac*100)}%</text>
  </svg>`;
}

/* dip (mm) -> litres curve, with optional marker */
function svgDipCurve(kind, markDip){
  const m = TANK_META[kind];
  const table = DB.calibration[kind] || [];
  const cap = tankCapacity(kind);
  const W=520, H=250, PL=54, PR=14, PT=14, PB=38;
  const pw=W-PL-PR, ph=H-PT-PB;
  if(!table.length) return '<p class="small-note">No dip chart loaded.</p>';
  const maxDip = table[table.length-1][0];
  const xMax = Math.ceil(maxDip/400)*400;
  const yMax = Math.max(cap, table[table.length-1][1]);
  const X = d => PL + pw*(d/xMax), Y = v => PT + ph - ph*(v/yMax);
  let grid='';
  for(let g=0; g<=5; g++){
    const v = yMax*g/5, y = Y(v);
    grid += `<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="var(--border-soft)"/>`;
    grid += `<text x="${PL-6}" y="${(y+3).toFixed(1)}" font-size="9.5" text-anchor="end" fill="var(--ink-soft)">${Math.round(v).toLocaleString()}</text>`;
  }
  for(let d=0; d<=xMax; d+=400){
    grid += `<text x="${X(d).toFixed(1)}" y="${H-20}" font-size="9.5" text-anchor="middle" fill="var(--ink-soft)">${d}</text>`;
  }
  let path = `M ${X(0).toFixed(1)} ${Y(0).toFixed(1)} `;
  table.forEach(([d,v])=>{ path += `L ${X(d).toFixed(1)} ${Y(v).toFixed(1)} `; });
  const area = path + `L ${X(maxDip).toFixed(1)} ${Y(0).toFixed(1)} Z`;
  let marker='';
  if(markDip!==null && markDip!==undefined && markDip!=='' && !isNaN(markDip)){
    const md = Math.max(0, Math.min(maxDip, Number(markDip)));
    const mv = physicalStock(kind, md);
    const mx = X(md), my = Y(mv);
    const anchor = mx > W-150 ? 'end' : 'start';
    const tx = anchor==='end' ? mx-8 : mx+8;
    marker = `<line x1="${mx.toFixed(1)}" y1="${my.toFixed(1)}" x2="${mx.toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="#b3413a" stroke-dasharray="4 3"/>
      <line x1="${PL}" y1="${my.toFixed(1)}" x2="${mx.toFixed(1)}" y2="${my.toFixed(1)}" stroke="#b3413a" stroke-dasharray="4 3"/>
      <circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="4.5" fill="#b3413a" stroke="#fff" stroke-width="1.5"/>
      <text x="${tx.toFixed(1)}" y="${Math.max(PT+10, my-10).toFixed(1)}" font-size="10.5" font-weight="700" text-anchor="${anchor}" fill="#b3413a">${Math.round(md)} mm · ${Math.round(mv).toLocaleString()} L</text>`;
  }
  const capY = Y(cap);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto;" role="img" aria-label="${m.short} dip chart: dip in mm against litres">
    ${grid}
    <path d="${area}" fill="${m.color}" opacity="0.10"/>
    <line x1="${PL}" y1="${capY.toFixed(1)}" x2="${W-PR}" y2="${capY.toFixed(1)}" stroke="#9aa5b1" stroke-dasharray="5 4"/>
    <text x="${PL+6}" y="${(capY+12).toFixed(1)}" font-size="9.5" fill="var(--ink-soft)">Capacity ${cap.toLocaleString()} L</text>
    <path d="${path}" fill="none" stroke="${m.color}" stroke-width="2.4" stroke-linejoin="round"/>
    ${marker}
    <text x="${(PL+pw/2).toFixed(1)}" y="${H-5}" font-size="10.5" text-anchor="middle" fill="var(--ink-soft)">Dip (mm)</text>
    <text x="11" y="${(PT+ph/2).toFixed(1)}" font-size="10.5" text-anchor="middle" fill="var(--ink-soft)" transform="rotate(-90 11 ${(PT+ph/2).toFixed(1)})">Litres</text>
  </svg>`;
}

function tankCalc(kind){
  const v = document.getElementById('calc-'+kind).value;
  const out = document.getElementById('calc-out-'+kind);

  if(v===''){ out.textContent='— L'; out.className='muted'; document.getElementById('curve-'+kind).innerHTML = svgDipCurve(kind, lv.hasDip? lv.dipMM : null); return; }
  const litres = physicalStock(kind, Number(v)||0);
  out.textContent = num(litres,0) + ' L';
  out.className = '';
  document.getElementById('curve-'+kind).innerHTML = svgDipCurve(kind, Number(v)||0);
}
function openDipChartTable(kind){
  const m = TANK_META[kind];
  const t = DB.calibration[kind] || [];
  const blocks = 4, per = Math.ceil(t.length/blocks);
  let head = '', body = '';
  for(let b=0;b<blocks;b++) head += `<th class="num">Dip (mm)</th><th class="num" style="border-right:${b<blocks-1?'2px solid var(--border)':'0'};">Litres</th>`;
  for(let i=0;i<per;i++){
    body += '<tr>';
    for(let b=0;b<blocks;b++){
      const p = t[b*per+i];
      body += p ? `<td class="num" style="padding:4px 10px;">${p[0]}</td><td class="num" style="padding:4px 10px; border-right:${b<blocks-1?'2px solid var(--border)':'0'};"><b>${num(p[1],0)}</b></td>` : `<td></td><td></td>`;
    }
    body += '</tr>';
  }
  openModal(m.label + ' — Dip chart (' + num(tankCapacity(kind),0) + ' L tank)',
    `<div class="tbl-wrap"><table class="tbl"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
     <p class="small-note" style="margin-top:10px;">${t.length} points from the supplied dip chart. Readings between two points are interpolated.</p>`,
    `<button class="btn" onclick="closeModal()">Close</button>`, true);
  document.getElementById('modal').style.maxWidth = '860px';
}

/* ---------- Bank deduction form helpers ---------- */
function bankPct(modeName, which){
  const b = DB.banks.find(x=>x.name===modeName);
  return b ? (Number(which==='deposit'? b.depositPct : b.withdrawPct)||0) : 0;
}
function dedFieldsHtml(row){
  return `<div class="field-row">
    <div class="field"><label>Bank deduction % (manual)</label>
      <input type="number" step="0.001" min="0" id="m-dedpct" value="${row&&row.dedPct?row.dedPct:''}" placeholder="0" oninput="dedPreview()">
      <span class="helptext">Charge taken by the bank on this deposit / withdrawal. Pre-filled from the bank's default in Setup; change it as needed.</span></div>
    <div class="field"><label>Deduction amount</label>
      <div id="m-dedamt" style="padding:9px 11px; border:1px solid var(--border); border-radius:8px; background:#f6f8fa; font-weight:700;">Rs. 0</div></div>
  </div>`;
}
function dedPreview(){
  const el = document.getElementById('m-dedamt'); if(!el) return;
  el.textContent = 'Rs. ' + num(calcDed(numVal('m-amount'), numVal('m-dedpct')), 2);
}
function dedAutoFill(kind){
  let pct = 0;
  if(kind==='receipt') pct = bankPct(val('m-mode'),'deposit');
  else if(kind==='payment') pct = bankPct(val('m-mode'),'withdraw');
  else if(kind==='partner') pct = bankPct(val('m-mode'), val('m-type')==='Deposit'?'deposit':'withdraw');
  else if(kind==='transfer'){ const f=val('m-from'), t=val('m-to'); pct = f!=='Cash' ? bankPct(f,'withdraw') : bankPct(t,'deposit'); }
  document.getElementById('m-dedpct').value = pct || '';
  dedPreview();
}
function dedFields(amount){ const pct = numVal('m-dedpct'); return {dedPct:pct, dedAmt:calcDed(amount,pct)}; }

function openReceiptForm(id){
  const row = id? DB.tx.receipts.find(r=>r.id===id) : null;

/* ---------- shared date-range picker used by several report pages ---------- */
var _rangeState = {};
function getRangeState(key, defaultDays){
  if(!_rangeState[key]){
    const end = todayISO();
    const start = addDaysISO(end, -(defaultDays-1));
    _rangeState[key] = {start, end};
  }
  return _rangeState[key];
}
function rangePickerHtml(key){
  const r = getRangeState(key);
  return `
    <div class="card card-pad" style="margin-bottom:14px; display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap;">
      <div class="field" style="margin-bottom:0;"><label>From</label><input type="date" value="${r.start}" onchange="_rangeState['${key}'].start=this.value; renderPage();"></div>
      <div class="field" style="margin-bottom:0;"><label>To</label><input type="date" value="${r.end}" onchange="_rangeState['${key}'].end=this.value; renderPage();"></div>
      <div class="pill-select">
        <button onclick="setQuickRange('${key}',7)">7d</button>
        <button onclick="setQuickRange('${key}',30)">30d</button>
        <button onclick="setQuickRange('${key}',90)">90d</button>
      </div>
    </div>`;
}
function setQuickRange(key, days){
  const end = todayISO();
  _rangeState[key] = {start: addDaysISO(end,-(days-1)), end};
  renderPage();
}

var CHART_COLORS = ['#0f5f4e','#c8862a','#2b6ca3','#6a4d9c','#b3413a','#3a9188','#9a7325'];

function svgBarChart(labels, series, opts){
  opts = opts||{};
  const W = opts.width||560, H = opts.height||220, PAD_L=46, PAD_B=28, PAD_T=12, PAD_R=10;
  const plotW = W-PAD_L-PAD_R, plotH = H-PAD_T-PAD_B;
  const n = labels.length;
  const maxV = Math.max(1, ...series.flatMap(s=>s.data));
  const groupW = plotW/n;
  const barW = Math.max(2, (groupW*0.62)/series.length);
  let bars='';
  labels.forEach((lab,i)=>{
    series.forEach((s,si)=>{
      const v = s.data[i]||0;
      const h = plotH * (v/maxV);
      const x = PAD_L + i*groupW + groupW*0.19 + si*barW;
      const y = PAD_T + plotH - h;
      bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${s.color||CHART_COLORS[si%CHART_COLORS.length]}"><title>${esc(s.name||'')} ${esc(lab)}: ${Math.round(v).toLocaleString()}</title></rect>`;
    });
  });
  let gridlines='', yLabels='';
  const steps=4;
  for(let g=0; g<=steps; g++){
    const yy = PAD_T + plotH - (plotH*g/steps);
    gridlines += `<line x1="${PAD_L}" y1="${yy.toFixed(1)}" x2="${W-PAD_R}" y2="${yy.toFixed(1)}" stroke="var(--border-soft)" stroke-width="1"/>`;
    yLabels += `<text x="${PAD_L-6}" y="${(yy+3).toFixed(1)}" font-size="9.5" text-anchor="end" fill="var(--ink-soft)">${Math.round(maxV*g/steps).toLocaleString()}</text>`;
  }
  let xLabels='';
  const stride = n>14? Math.ceil(n/14) : 1;
  labels.forEach((lab,i)=>{
    if(i%stride!==0) return;
    const x = PAD_L + i*groupW + groupW/2;
    xLabels += `<text x="${x.toFixed(1)}" y="${H-8}" font-size="9.5" text-anchor="middle" fill="var(--ink-soft)">${esc(lab)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:${H}px;">${gridlines}${bars}${yLabels}${xLabels}</svg>`;
}

function svgLineChart(labels, series, opts){
  opts = opts||{};
  const W = opts.width||560, H = opts.height||220, PAD_L=46, PAD_B=28, PAD_T=12, PAD_R=10;
  const plotW = W-PAD_L-PAD_R, plotH = H-PAD_T-PAD_B;
  const n = labels.length;
  const maxV = Math.max(1, ...series.flatMap(s=>s.data));
  const stepX = n>1? plotW/(n-1) : 0;
  let gridlines='', yLabels='';
  const steps=4;
  for(let g=0; g<=steps; g++){
    const yy = PAD_T + plotH - (plotH*g/steps);
    gridlines += `<line x1="${PAD_L}" y1="${yy.toFixed(1)}" x2="${W-PAD_R}" y2="${yy.toFixed(1)}" stroke="var(--border-soft)" stroke-width="1"/>`;
    yLabels += `<text x="${PAD_L-6}" y="${(yy+3).toFixed(1)}" font-size="9.5" text-anchor="end" fill="var(--ink-soft)">${Math.round(maxV*g/steps).toLocaleString()}</text>`;
  }
  let paths='';
  series.forEach((s,si)=>{
    const color = s.color||CHART_COLORS[si%CHART_COLORS.length];
    let d='';
    let pts='';
    s.data.forEach((v,i)=>{
      const x = PAD_L + i*stepX;
      const y = PAD_T + plotH - plotH*(v/maxV);
      d += (i===0?'M':'L') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
      pts += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.4" fill="${color}"><title>${esc(s.name||'')} ${esc(labels[i])}: ${num(v,2)}</title></circle>`;
    });
    paths += `<path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>` + pts;
  });
  let xLabels='';
  const stride = n>14? Math.ceil(n/14) : 1;
  labels.forEach((lab,i)=>{
    if(i%stride!==0) return;
    const x = PAD_L + i*stepX;
    xLabels += `<text x="${x.toFixed(1)}" y="${H-8}" font-size="9.5" text-anchor="middle" fill="var(--ink-soft)">${esc(lab)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:${H}px;">${gridlines}${paths}${xLabels}</svg>`;
}

function svgDonut(segments, opts){
  opts = opts||{};
  const size = opts.size||160, stroke = opts.stroke||24;
  const r = (size-stroke)/2, cx=size/2, cy=size/2, C=2*Math.PI*r;
  const total = segments.reduce((s,x)=>s+Math.max(0,x.value),0) || 1;
  let offset = 0, circles='';
  segments.forEach((s,i)=>{
    const frac = Math.max(0,s.value)/total;
    const len = frac*C;
    const color = s.color || CHART_COLORS[i%CHART_COLORS.length];
    circles += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-dasharray="${len.toFixed(1)} ${(C-len).toFixed(1)}" stroke-dashoffset="${(-offset).toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"><title>${esc(s.name)}: ${Math.round(s.value).toLocaleString()}</title></circle>`;
    offset += len;
  });
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px; height:${size}px;">${circles||`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${stroke}"/>`}</svg>`;
}
function legendHtml(segments){
  const total = segments.reduce((s,x)=>s+Math.max(0,x.value),0) || 1;
  return `<div class="chart-legend">${segments.map((s,i)=>`<span><i style="background:${s.color||CHART_COLORS[i%CHART_COLORS.length]}"></i>${esc(s.name)} — ${money(s.value)} (${Math.round(100*Math.max(0,s.value)/total)}%)</span>`).join('')}</div>`;
}

function r2(x){ return Math.round((Number(x)||0)*100)/100; }
function sumBy(arr, f){ return arr.reduce((s,r)=>s+(Number(f(r))||0),0); }
function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(c=>{ const s=String(c==null?'':c); return /[",\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; }).join(',')).join('\n');
  downloadBlob(filename, '﻿'+csv, 'text/csv;charset=utf-8');
}

/* ---------- schema safety (older data files upgrade silently) ---------- */
var EXPENSE_HEADS_BASE = null;
function syncExpenseHeads(){
  if(!DB.meta.expenseHeads || !DB.meta.expenseHeads.length) DB.meta.expenseHeads = (EXPENSE_HEADS_BASE||EXPENSE_HEADS).slice();
  // any head already used in an expense entry must stay selectable
  (DB.tx.expenses||[]).forEach(r=>{ if(r.head && DB.meta.expenseHeads.indexOf(r.head)<0) DB.meta.expenseHeads.push(r.head); });
  EXPENSE_HEADS = DB.meta.expenseHeads;
}
function ensureSchema(){
  if(!DB.tx) DB.tx = {};
  ['nozzleDiesel','nozzlePetrol','dip','creditSale','cashOils','purchases','receipts','payments','expenses','fundTransfer','partnersLedger','employeeLedger','cardSales','swaps','dayClose','cashFuel'].forEach(k=>{ if(!DB.tx[k]) DB.tx[k]=[]; });
  Object.keys(DB.tx).forEach(k=>DB.tx[k].forEach(r=>{ if(!r.id) r.id = uid(k); }));
  if(!DB.terminals) DB.terminals = [];
  if(!DB.users) DB.users = [];
  if(!DB.meta.costing) DB.meta.costing = 'FIFO';
  ['diesel','petrol'].forEach(k=>{ if(DB.fuel[k].openingCost===undefined) DB.fuel[k].openingCost = DB.fuel[k].costRate||0; });
}

/* ---------- purchases: invoice amount is the truth ---------- */
function purchaseAmt(r){ return (r.amount!==undefined && r.amount!==null && r.amount!=='') ? Number(r.amount) : Number(r.qty||0)*Number(r.rate||0); }
function purchaseRate(r){ const q=Number(r.qty)||0; return q>0 ? purchaseAmt(r)/q : (Number(r.rate)||0); }

/* ---------- FIFO fuel costing (same method as the Excel sheets) ---------- */
var _fifoCache = {v:-1, diesel:null, petrol:null};
function nozzleLitresOf(kind, entry){
  let t = 0;
  entry.closings.forEach((c,i)=>{ t += Math.max(0, Number(c||0) - nozzleOpeningFor(kind,i,entry.date)); });
  return t;
}
function fifoOpeningCost(kind){
  const f = DB.fuel[kind];
  return Number(f.openingCost!==undefined && f.openingCost!=='' && f.openingCost!==null ? f.openingCost : f.costRate) || 0;
}
function fifoMap(kind){
  if(_fifoCache.v !== _dbv){ _fifoCache = {v:_dbv, diesel:null, petrol:null}; }
  if(_fifoCache[kind]) return _fifoCache[kind];
  const label = kind==='diesel' ? 'Diesel' : 'Petrol';
  const openCost = fifoOpeningCost(kind);
  const lots = [{qty:Number(DB.fuel[kind].openingStock)||0, cost:openCost}];
  sortByDate(DB.tx.purchases.filter(r=>r.product===label)).forEach(r=>{ const q=Number(r.qty)||0; if(q>0) lots.push({qty:q, cost:purchaseRate(r)}); });
  let li = 0, rem = lots[0].qty, lastCost = openCost;
  const map = {};
  sortByDate(DB.tx[nozzleKey(kind)]).forEach(e=>{
    const litres = nozzleLitresOf(kind,e);
    let need = litres, cogs = 0;
    while(need > 1e-9){
      while(rem <= 1e-9 && li < lots.length-1){ li++; rem = lots[li].qty; }
      if(rem <= 1e-9){ cogs += need*lastCost; need = 0; break; }   // stock-out: priced at last known cost
      const take = Math.min(need, rem);
      cogs += take*lots[li].cost; lastCost = lots[li].cost; rem -= take; need -= take;
    }
    map[e.id] = {cogs, litres, date:e.date};
  });
  _fifoCache[kind] = map;
  return map;
}
function fifoClosingValue(kind, asOf){
  const label = kind==='diesel' ? 'Diesel' : 'Petrol';
  const opening = (Number(DB.fuel[kind].openingStock)||0) * fifoOpeningCost(kind);
  const bought = sumBy(DB.tx.purchases.filter(r=>r.product===label && r.date<=asOf), purchaseAmt);
  const m = fifoMap(kind);
  const sold = sumBy(DB.tx[nozzleKey(kind)].filter(r=>r.date<=asOf), r=> (m[r.id]||{cogs:0}).cogs);
  return opening + bought - sold;
}

/* ---------- PSO / terminals ---------- */
function psoSupplier(){ return DB.suppliers.find(s=>s.isPSO) || DB.suppliers.find(s=>/\bpso\b|pakistan state oil/i.test(s.name)) || null; }
function terminalById(id){ return DB.terminals.find(t=>t.id===id); }
function terminalName(id){ const t=terminalById(id); return t? t.name : '—'; }
function settleTargets(){ return ['PSO', ...DB.banks.map(b=>b.name)]; }
function settleOptionsHtml(sel){ return settleTargets().map(m=>`<option value="${esc(m)}" ${m===sel?'selected':''}>${m==='PSO'?'PSO (direct — reduces PSO payable)':esc(m)}</option>`).join(''); }

/* ---------- card / POS sales & swaps ---------- */
function cardFee(r){ return r2(Number(r.gross||0)*Number(r.pct||0)/100); }
function cardNet(r){ return Number(r.gross||0) - cardFee(r); }
function cardSettleDate(r){ return r.status==='Pending' ? null : (r.settleDate || r.date); }
function cardGrossSum(date){ return sumBy(DB.tx.cardSales.filter(r=>r.date===date), r=>r.gross); }
function swapFee(r){ return r2(Number(r.amount||0)*Number(r.pct||0)/100); }
function swapNet(r){ return Number(r.amount||0) - swapFee(r); }
function swapSettleDate(r){ return r.status==='Pending' ? null : (r.settleDate || r.date); }
function cardFeeRows(start,end){
  const rows = [];
  DB.tx.cardSales.forEach(r=>{ const f=cardFee(r); if(f>0 && dateInRange(r.date,start,end)) rows.push({date:r.date, source:'Card / POS sale', who:terminalName(r.terminalId), mode:r.settleTo, pct:Number(r.pct)||0, base:Number(r.gross)||0, amount:f, _seq:r._seq}); });
  DB.tx.swaps.forEach(r=>{ const f=swapFee(r); if(f>0 && dateInRange(r.date,start,end)) rows.push({date:r.date, source:'Swap (card cash-out)', who:terminalName(r.terminalId)+(r.customer?' — '+r.customer:''), mode:r.settleTo, pct:Number(r.pct)||0, base:Number(r.amount)||0, amount:f, _seq:r._seq}); });
  return sortByDate(rows);
}
function swapIncomeSum(start,end){ return sumBy(DB.tx.swaps.filter(r=>dateInRange(r.date,start,end)), r=>r.custCharge); }

/* Cash that really lands in the drawer from fuel + oil sales on a day:
   total sales − credit (udhaar) − card/POS − (swaps are separate) */
function cashSalesNet(date){
  const fuelTotal = nozzleSaleAmount('diesel',date) + nozzleSaleAmount('petrol',date);
  const credFuel = creditSaleSum(date,'Diesel') + creditSaleSum(date,'Petrol') + creditSaleSum(date,'Amount');
  return fuelTotal - credFuel + cashOilsSum(date) - cardGrossSum(date);
}

/* ---------- Cash / bank engine (mode aware) ---------- */
function modeParts(mode, date){
  const T = DB.tx, A = r=>Number(r.amount||0), on = r=>r.date===date;
  const I = {}, O = {};
  I.sales      = (mode==='Cash' && cashBooksActive(date)) ? cashSalesNet(date) : 0;
  I.receipts   = sumBy(T.receipts.filter(r=>on(r)&&r.mode===mode), A);
  I.partner    = sumBy(T.partnersLedger.filter(r=>on(r)&&r.type==='Deposit'&&r.mode===mode), A);
  I.advBack    = sumBy(T.employeeLedger.filter(r=>on(r)&&r.type==='Advance Recovered'&&r.mode===mode), A);
  I.transfers  = sumBy(T.fundTransfer.filter(r=>on(r)&&r.to===mode), A);
  I.cardSettle = sumBy(T.cardSales.filter(r=>cardSettleDate(r)===date && r.settleTo===mode), cardNet);
  I.swapSettle = sumBy(T.swaps.filter(r=>swapSettleDate(r)===date && r.settleTo===mode), swapNet);
  I.swapCharge = mode==='Cash' ? sumBy(T.swaps.filter(on), r=>r.custCharge) : 0;
  O.payments   = sumBy(T.payments.filter(r=>on(r)&&r.mode===mode), A);
  O.expenses   = sumBy(T.expenses.filter(r=>on(r)&&r.mode===mode), A);
  O.salary     = sumBy(T.employeeLedger.filter(r=>on(r)&&(r.type==='Salary Paid'||r.type==='Advance Given')&&r.mode===mode), A);
  O.drawings   = sumBy(T.partnersLedger.filter(r=>on(r)&&r.type==='Drawing'&&r.mode===mode), A);
  O.transfers  = sumBy(T.fundTransfer.filter(r=>on(r)&&r.from===mode), A);
  O.deductions = sumBy(T.receipts.filter(r=>on(r)&&r.mode===mode), dedOf) + sumBy(T.payments.filter(r=>on(r)&&r.mode===mode), dedOf)
               + sumBy(T.partnersLedger.filter(r=>on(r)&&r.mode===mode), dedOf) + sumBy(T.fundTransfer.filter(r=>on(r)&&transferChargeMode(r)===mode), dedOf);
  O.swapCash   = mode==='Cash' ? sumBy(T.swaps.filter(on), A) : 0;
  const sum = o=>Object.values(o).reduce((a,b)=>a+b,0);
  return {I, O, in:sum(I), out:sum(O)};
}
function modeInSum(mode, date){ return modeParts(mode,date).in; }
function modeOutSum(mode, date){ return modeParts(mode,date).out; }

/* ---------- Day book = the CASH book ---------- */
function dayBookRow(date, prevClosing){
  const posted = cashBooksActive(date);
  const dieselTotal = nozzleSaleAmount('diesel', date), petrolTotal = nozzleSaleAmount('petrol', date);
  const dieselCash = posted ? dieselTotal - creditSaleSum(date,'Diesel') : 0;
  const petrolCash = posted ? petrolTotal - creditSaleSum(date,'Petrol') : 0;
  const oilsCash = cashOilsSum(date);
  const cards = posted ? cardGrossSum(date) : 0;
  const creditAmt = posted ? creditSaleSum(date,'Amount') : 0;
  const cp = modeParts('Cash', date);
  const creditRef = creditSaleSumAll(date);
  const totalCashSales = cp.I.sales;
  const closing = prevClosing + cp.in - cp.out;
  return {date, opening:prevClosing, dieselCash, petrolCash, oilsCash, cards, creditAmt, totalCashSales, creditRef,
    receipts:cp.I.receipts, otherIn: cp.in - cp.I.sales - cp.I.receipts,
    supplierPayments:cp.O.payments, expenses:cp.O.expenses, deductions:cp.O.deductions, salaryPaid:cp.O.salary,
    swapCash: cp.O.swapCash - cp.I.swapCharge, deposits: cp.O.transfers, drawings: cp.O.drawings,
    advNet: 0, totalIn:cp.in, totalOut:cp.out, closing, totalRevenue: totalCashSales + cards + creditRef};
}

/* ---------- Nozzle form: purchase (cost) price is automatic = FIFO from stock ---------- */
function fifoPreview(kind, date, closings){
  const key = nozzleKey(kind), list = DB.tx[key];
  const saved = list.slice();
  const keep = list.filter(r=>r.date!==date);
  const tmp = {id:'__tmp', date, closings, rate:0, _seq:1e9};
  list.length = 0; keep.forEach(r=>list.push(r)); list.push(tmp);
  _dbv++;
  let res = null;
  try{ const f = fifoMap(kind)['__tmp']; if(f) res = {cogs:f.cogs, litres:f.litres}; }
  finally{ list.length = 0; saved.forEach(r=>list.push(r)); _dbv++; }
  return res;
}
function nozzleCostAuto(kind){
  const date = val('m-date');
  const closings = DB.nozzles[kind].map((n,i)=> Number(val('m-close-'+i))||0);
  const f = fifoPreview(kind, date, closings);
  const el = document.getElementById('m-cost'), hint = document.getElementById('m-costhint');
  if(!el) return;
  if(f && f.litres>0){
    el.value = (f.cogs/f.litres).toFixed(4);
    if(hint) hint.textContent = 'Automatic (FIFO from stock): '+num(f.litres,2)+' L × '+num(f.cogs/f.litres,4)+' = '+money(f.cogs);
  } else {
    el.value = fifoOpeningCost(kind) ? fifoNextCost(kind) : 0;
    if(hint) hint.textContent = 'Automatic (FIFO): enter closing readings to see the cost of this day\'s litres.';
  }
}
function fifoNextCost(kind){
  const f = fifoPreview(kind, '9999-12-31', DB.nozzles[kind].map((n,i)=>nozzleOpeningFor(kind,i,'9999-12-31')+1));
  return f && f.litres>0 ? (f.cogs/f.litres).toFixed(4) : 0;
}
function openNozzleForm(kind, id){
  _orig_openNozzleForm(kind, id);
  const ci = document.getElementById('m-cost');
  if(ci){ ci.readOnly = true; ci.style.background = '#f6f8fa'; }
  DB.nozzles[kind].forEach((n,i)=>{ const c=document.getElementById('m-close-'+i); if(c) c.setAttribute('oninput',"nozzleCostAuto('"+kind+"')"); });
  nozzleCostAuto(kind);
}

function dcRecalc(){
  let t = 0;
  DENOMS.forEach(x=>{ const q=Number(document.getElementById('dn-'+x).value)||0; t += q*x; const c=document.getElementById('dna-'+x); if(c) c.textContent = money(q*x); });
  t += Number(document.getElementById('dn-coins').value)||0;
  document.getElementById('dn-total').textContent = money(t);
  const diff = t - (window._dcBook||0);
  const el = document.getElementById('dn-var');
  if(el) el.innerHTML = t===0 ? 'Enter the notes counted to compare with the book.' :
    (Math.abs(diff)<1 ? '<b style="color:var(--brand-dark)">✔ Cash matches the book.</b>' : `<b style="color:var(--red)">${diff>0?'Excess':'Short'}: ${money(Math.abs(diff))}</b> — counted ${money(t)} vs book ${money(window._dcBook||0)}`);
}
function saveDayClose(date){
  const notes = {}; DENOMS.forEach(x=>{ notes[x] = Number(document.getElementById('dn-'+x).value)||0; });
  const obj = {date, notes, coins:Number(document.getElementById('dn-coins').value)||0, remarks:document.getElementById('dn-remarks').value.trim()};
  const ex = DB.tx.dayClose.find(r=>r.date===date);
  if(ex) txUpdate('dayClose', ex.id, obj); else txAdd('dayClose', obj);
  toast('Cash count saved.','ok'); renderPage();
}

function bankDepositSuggest(date){
  const cp = modeParts('Cash', date);

}

/* supplier ledger: PSO also receives card sales settled directly to it */
function supplierTransactions(supId){
  const rows=[];
  DB.tx.purchases.filter(r=>r.supplierId===supId).forEach(r=>{
    rows.push({date:r.date, type:'Purchase', desc:purchaseDesc(r)+(r.ref?' · inv '+r.ref:''), debit:0, credit:purchaseAmt(r), _seq:r._seq, ref:r});
  });
  DB.tx.payments.filter(r=>r.supplierId===supId).forEach(r=>{
    rows.push({date:r.date, type:'Payment', desc:(r.narration||('Paid via '+r.mode))+(r.ref?' · ref '+r.ref:''), debit:Number(r.amount||0), credit:0, _seq:r._seq, ref:r});
  });
  const pso = psoSupplier();
  if(pso && pso.id===supId){
    DB.tx.cardSales.filter(r=>r.settleTo==='PSO' && r.status!=='Pending').forEach(r=>{
      rows.push({date:r.settleDate||r.date, type:'POS settlement', desc:terminalName(r.terminalId)+' — gross '+money(r.gross)+(cardFee(r)?', fee '+money(cardFee(r)):'')+' (credited straight to PSO)', debit:cardNet(r), credit:0, _seq:r._seq+0.5, ref:r});
    });
  }
  return sortByDate(rows);
}
function purchaseDesc(r){ return 'Purchase — '+productLabel(r.product)+' ('+num(r.qty,0)+' '+productUnit(r.product)+')'; }
function recentActivity(n){
  const items = [];
  DB.tx.nozzleDiesel.forEach(r=>items.push({date:r.date,type:'Diesel Sale',desc:num(computeNozzleRow('diesel',r).totalLitres,0)+' L',amount:computeNozzleRow('diesel',r).amount,_seq:r._seq}));
  DB.tx.nozzlePetrol.forEach(r=>items.push({date:r.date,type:'Petrol Sale',desc:num(computeNozzleRow('petrol',r).totalLitres,0)+' L',amount:computeNozzleRow('petrol',r).amount,_seq:r._seq}));
  DB.tx.creditSale.forEach(r=>items.push({date:r.date,type:'Credit Sale',desc:nameOf('customers',r.customerId),amount:csNet(r),_seq:r._seq}));
  DB.tx.cashOils.forEach(r=>items.push({date:r.date,type:'Counter Sale',desc:productLabel(r.product),amount:r.qty*r.rate,_seq:r._seq}));
  DB.tx.cardSales.forEach(r=>items.push({date:r.date,type:'Card Sale',desc:terminalName(r.terminalId),amount:r.gross,_seq:r._seq}));
  DB.tx.swaps.forEach(r=>items.push({date:r.date,type:'Card Swap',desc:terminalName(r.terminalId),amount:r.amount,_seq:r._seq}));
  DB.tx.purchases.forEach(r=>items.push({date:r.date,type:'Purchase',desc:productLabel(r.product)+' — '+nameOf('suppliers',r.supplierId),amount:purchaseAmt(r),_seq:r._seq}));
  DB.tx.receipts.forEach(r=>items.push({date:r.date,type:'Receipt',desc:nameOf('customers',r.customerId),amount:r.amount,_seq:r._seq}));
  DB.tx.payments.forEach(r=>items.push({date:r.date,type:'Payment',desc:r.type==='Supplier Payment'?nameOf('suppliers',r.supplierId):(r.paidTo||'—'),amount:r.amount,_seq:r._seq}));
  DB.tx.expenses.forEach(r=>items.push({date:r.date,type:'Expense',desc:r.head,amount:r.amount,_seq:r._seq}));
  items.sort((a,b)=> a.date===b.date ? b._seq-a._seq : (a.date<b.date?1:-1));
  return items.slice(0,n);
}

}

function accountLines(mode){
  const L = [], T = DB.tx, A = r=>Number(r.amount||0);
  const push = (date,seq,type,desc,ref,inn,out)=>{ if(Math.abs(inn||0)>0.004 || Math.abs(out||0)>0.004) L.push({date, _seq:seq||0, type, desc, ref:ref||'', inn:inn||0, out:out||0}); };
  if(mode==='Cash'){
    allCalendarDates().forEach(d=>{ if(cashBooksActive(d)){ const v=cashSalesNet(d); push(d,-1,'Cash sales','Fuel & oil cash sales (after credit and card)','', v>0?v:0, v<0?-v:0); } });
    T.swaps.forEach(r=>{ push(r.date,r._seq,'Card swap','Cash handed to '+(r.customer||'customer')+' against card swipe',r.ref,0,A(r)); if(r.custCharge) push(r.date,r._seq+.1,'Swap charge','Service charge collected','',Number(r.custCharge),0); });
  }

    if(r.from===mode) push(r.date,r._seq,'Transfer out','To '+r.to+(r.narration?' — '+r.narration:''),r.ref,0,A(r));
    if(transferChargeMode(r)===mode && dedOf(r)) push(r.date,r._seq+.1,'Bank charge','Deduction '+r.dedPct+'% on transfer','',0,dedOf(r));
  });
  T.cardSales.filter(r=>r.settleTo===mode && r.status!=='Pending').forEach(r=>push(r.settleDate||r.date,r._seq,'Card settlement',terminalName(r.terminalId)+' sale of '+fmtDateShort(r.date)+' — gross '+money(r.gross)+', fee '+money(cardFee(r)),r.ref,cardNet(r),0));

function modeKey(m){ return m==='Cash' ? 'cash' : 'bank:'+m; }
var EXP_CODES = {'Daily Water':6010,'Staff Refreshment':6020,'Bike Petrol':6030,'Fuel Delivery Charges':6040,'Data Service':6050,'Utility Bill':6060,'Electricity':6070,'Rent':6080,'Maintenance':6090,'Fuel Testing':6100,'Security':6110,'Stationery':6120,'Refreshment':6130,'Misc / Other':6190};
function acctInfo(key){
  const i = key.indexOf(':'), k = i<0? key : key.slice(0,i), id = i<0? '' : key.slice(i+1);
  const idx = (arr,f)=>Math.max(0, arr.findIndex(f));
  switch(k){
    case 'cash': return {code:1010,name:'Cash in Hand',type:'asset',grp:'Cash & Bank'};
    case 'bank': return {code:1020+idx(DB.banks,b=>b.name===id),name:'Bank – '+id,type:'asset',grp:'Cash & Bank'};
    case 'pos':  return {code:1100,name:'Card / POS Settlements Receivable',type:'asset',grp:'Receivables'};
    case 'cust': return {code:1200+idx(DB.customers,c=>c.id===id),name:'Receivable – '+nameOf('customers',id),type:'asset',grp:'Receivables'};
    case 'emp':  return {code:1300+idx(DB.employees,c=>c.id===id),name:'Employee Advance – '+nameOf('employees',id),type:'asset',grp:'Receivables'};

  { const o = mk(DB.meta.startDate,'OB','Opening balances'); let net = 0;
    const dr=(a,v)=>{ if(!v) return; o.D(a,v); net+=v; }, cr=(a,v)=>{ if(!v) return; o.C(a,v); net-=v; };

    DB.oils.forEach(x=>dr('inv:'+x.id,(Number(x.openingStock)||0)*(Number(x.costRate)||0)));
    DB.suppliers.forEach(s=>cr('sup:'+s.id,Number(s.openingBalance)||0));

    const d = dRow? computeNozzleRow('diesel',dRow):null, p = pRow? computeNozzleRow('petrol',pRow):null;
    const cashOils = T.cashOils.filter(r=>r.date===date), credits = T.creditSale.filter(r=>r.date===date), cards = T.cardSales.filter(r=>r.date===date);
    const creditOil = credits.filter(r=>r.type==='Oil');
    const oilsTotal = sumBy(cashOils,r=>r.qty*r.rate) + sumBy(creditOil,csGross);
    const totalCr = (d?d.amount:0)+(p?p.amount:0)+oilsTotal;
    if(d) v.C('inc:Diesel',d.amount); if(p) v.C('inc:Petrol',p.amount); v.C('inc:Oils',oilsTotal);
    let others = 0;
    credits.forEach(r=>{ v.D('cust:'+r.customerId,csNet(r)); others += csNet(r); });
    const disc = sumBy(credits,csDisc); v.D('disc',disc); others += disc;
    cards.forEach(r=>{ v.D('pos',cardNet(r)); v.D('exp:card',cardFee(r)); others += r.gross; });
    const cashDr = totalCr - others;
    v.D(cashBooksActive(date)?'cash':'cap:open', cashDr);

    [...cashOils,...creditOil].forEach(r=>{ const o=DB.oils.find(x=>x.id===r.product); const cr=Number(r.costRate)>0?Number(r.costRate):(o?Number(o.costRate)||0:0); v.D('cogs:Oils',r.qty*cr); v.C('inv:'+r.product,r.qty*cr); });

  T.purchases.forEach(r=>{ const v=mk(r.date,'PV','Purchase '+productLabel(r.product)+' '+num(r.qty,2)+' — '+nameOf('suppliers',r.supplierId),r.ref); v.D('inv:'+r.product,purchaseAmt(r)); v.C('sup:'+r.supplierId,purchaseAmt(r)); v.post(); });
  const ded = (v,r,modeName)=>{ if(dedOf(r)>0){ v.D('exp:bank',dedOf(r)); v.C(modeKey(modeName),dedOf(r)); } };
  T.payments.forEach(r=>{ const v=mk(r.date,'PY','Payment — '+(r.type==='Supplier Payment'?nameOf('suppliers',r.supplierId):(r.paidTo||'other')),r.ref); v.D(r.type==='Supplier Payment'?'sup:'+r.supplierId:'oth',Number(r.amount)); v.C(modeKey(r.mode),Number(r.amount)); ded(v,r,r.mode); v.post(); });
  T.receipts.forEach(r=>{ const v=mk(r.date,'RV','Receipt — '+nameOf('customers',r.customerId),r.ref); v.D(modeKey(r.mode),Number(r.amount)); v.C('cust:'+r.customerId,Number(r.amount)); ded(v,r,r.mode); v.post(); });
  T.expenses.forEach(r=>{ const v=mk(r.date,'EV','Expense — '+r.head+(r.narration?' ('+r.narration+')':'')); v.D('exp:'+r.head,Number(r.amount)); v.C(modeKey(r.mode),Number(r.amount)); v.post(); });
  T.fundTransfer.forEach(r=>{ const v=mk(r.date,'TV',(r.from==='Cash'?'Bank deposit by '+(r.depositor||'—'):'Transfer')+' '+r.from+' → '+r.to,r.ref); v.D(modeKey(r.to),Number(r.amount)); v.C(modeKey(r.from),Number(r.amount)); ded(v,r,transferChargeMode(r)); v.post(); });
  T.partnersLedger.forEach(r=>{ const v=mk(r.date,'PT','Partner '+r.type+' — '+nameOf('partners',r.partnerId)); if(r.type==='Deposit'){ v.D(modeKey(r.mode),Number(r.amount)); v.C('cap:'+r.partnerId,Number(r.amount)); } else { v.D('cap:'+r.partnerId,Number(r.amount)); v.C(modeKey(r.mode),Number(r.amount)); } ded(v,r,r.mode); v.post(); });
  T.employeeLedger.forEach(r=>{ const v=mk(r.date,'EM',r.type+' — '+nameOf('employees',r.employeeId)); const a=Number(r.amount);
    if(r.type==='Salary Paid'){ v.D('exp:salary',a); v.C(modeKey(r.mode),a); } else if(r.type==='Advance Given'){ v.D('emp:'+r.employeeId,a); v.C(modeKey(r.mode),a); } else { v.D(modeKey(r.mode),a); v.C('emp:'+r.employeeId,a); } v.post(); });

  T.cardSales.filter(r=>r.status!=='Pending').forEach(r=>{ const v=mk(r.settleDate||r.date,'CS','Card settlement — '+terminalName(r.terminalId),r.ref); v.D(r.settleTo==='PSO'&&pso ? 'sup:'+pso.id : modeKey(r.settleTo), cardNet(r)); v.C('pos',cardNet(r)); v.post(); });

/* ---------- minimal ZIP (store) + XLSX writer — no libraries needed ---------- */
function crc32(u8){ if(!crc32.t){ crc32.t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; crc32.t[n]=c>>>0; } } let crc=-1; for(let i=0;i<u8.length;i++) crc=crc32.t[(crc^u8[i])&255]^(crc>>>8); return (crc^-1)>>>0; }
function zipStore(files){
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  files.forEach(f=>{
    const nm=enc.encode(f.name), d=typeof f.data==='string'?enc.encode(f.data):f.data, crc=crc32(d);
    const lh=new DataView(new ArrayBuffer(30)); lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(12,0x21,true); lh.setUint32(14,crc,true); lh.setUint32(18,d.length,true); lh.setUint32(22,d.length,true); lh.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(lh.buffer), nm, d);
    const ch=new DataView(new ArrayBuffer(46)); ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(14,0x21,true); ch.setUint32(16,crc,true); ch.setUint32(20,d.length,true); ch.setUint32(24,d.length,true); ch.setUint16(28,nm.length,true); ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer), nm); off += 30+nm.length+d.length;
  });
  const csz=central.reduce((a,b)=>a+b.length,0), end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true); end.setUint32(12,csz,true); end.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(end.buffer)]);
}
function xmlEsc(s){ return String(s).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function xlCol(i){ let s=''; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); } return s; }
function xlsxSheetXml(head, rows){
  const all=[head,...rows], ncol=head.length;
  const widths = head.map((h,c)=>{ let w=String(h).length; rows.slice(0,200).forEach(r=>{ const v=r[c]; const l=(typeof v==='number')? v.toFixed(2).length+2 : String(v==null?'':v).length; if(l>w) w=l; }); return Math.min(48,Math.max(9,w+2)); });
  let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>'
    + widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('') + '</cols><sheetData>';
  all.forEach((r,ri)=>{
    x += `<row r="${ri+1}">`;
    for(let c=0;c<ncol;c++){
      const v=r[c], ref=xlCol(c)+(ri+1);
      if(v===null||v===undefined||v==='') continue;
      if(ri===0) x += `<c r="${ref}" s="1" t="inlineStr"><is><t>${xmlEsc(v)}</t></is></c>`;
      else if(typeof v==='number' && isFinite(v)) x += `<c r="${ref}" s="2"><v>${v}</v></c>`;
      else x += `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
    }
    x += '</row>';
  });
  x += `</sheetData><autoFilter ref="A1:${xlCol(Math.max(0,ncol-1))}${Math.max(1,all.length)}"/></worksheet>`;
  return x;
}
function buildXlsx(sheets){ // sheets: [{name, head, rows}]
  const used={}; const names = sheets.map(s=>{ let n=s.name.replace(/[\[\]:*?\/\\]/g,' ').slice(0,31).trim()||'Sheet'; let k=n,i=2; while(used[k.toLowerCase()]){ k=n.slice(0,28)+' '+(i++); } used[k.toLowerCase()]=1; return k; });
  const ns='xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
  const files = [
    {name:'[Content_Types].xml', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')+'</Types>'},
    {name:'_rels/.rels', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:'xl/workbook.xml', data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook ${ns}><sheets>`+names.map((n,i)=>`<sheet name="${xmlEsc(n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')+'</sheets></workbook>'},
    {name:'xl/_rels/workbook.xml.rels', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')+`<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
    {name:'xl/styles.xml', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF0D3F34"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="4" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'},
  ];
  sheets.forEach((s,i)=>files.push({name:`xl/worksheets/sheet${i+1}.xml`, data:xlsxSheetXml(s.head,s.rows)}));

function csvText(head, rows){
  const q = v=>{ v = v==null? '' : (typeof v==='number'? String(Math.round(v*1e6)/1e6) : String(v)); return /[",\n\r]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; };

function genericTable(key){

  const keys=[]; rows.forEach(r=>Object.keys(r).forEach(k=>{ if(k!=='id'&&k!=='_seq'&&keys.indexOf(k)<0) keys.push(k); }));
  const label = k=> ID_MAPS[k]? ID_MAPS[k][0] : k.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase());
  const cell = (k,v)=>{
    if(v===undefined||v===null) return '';
    if(ID_MAPS[k]) return nameOf(ID_MAPS[k][1], v);
    if(k==='product') return productLabel(v)==='—'? v : productLabel(v);
    if(Array.isArray(v)) return v.join(' | ');
    if(typeof v==='object') return JSON.stringify(v);
