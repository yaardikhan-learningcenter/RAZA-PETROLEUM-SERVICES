/* ---- SHA-256 (pure JS so it also works on plain http / file pages) ---- */
var _SHA = (function(){
  const pr=[]; for(let n=2; pr.length<64; n++){ let ok=true; for(let d=2; d*d<=n; d++) if(n%d===0){ ok=false; break; } if(ok) pr.push(n); }
  const frac = x=> Math.floor((x - Math.floor(x))*4294967296)>>>0;
  return {K: pr.map(p=>frac(Math.cbrt(p))), H: pr.slice(0,8).map(p=>frac(Math.sqrt(p)))};
})();
function sha256hex(str){
  const bytes = new TextEncoder().encode(str), K=_SHA.K, H=_SHA.H.slice();
  const l=bytes.length, bl=l*8, padLen=((l+9+63)>>6)<<6, m=new Uint8Array(padLen); m.set(bytes); m[l]=0x80;
  const dv=new DataView(m.buffer); dv.setUint32(padLen-4, bl>>>0); dv.setUint32(padLen-8, Math.floor(bl/4294967296));
  const w=new Uint32Array(64);
  for(let o=0;o<padLen;o+=64){
    for(let i=0;i<16;i++) w[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){ const a=w[i-15], b=w[i-2]; const s0=((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3); const s1=((b>>>17)|(b<<15))^((b>>>19)|(b<<13))^(b>>>10); w[i]=(w[i-16]+s0+w[i-7]+s1)|0; }
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let i=0;i<64;i++){
      const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)), ch=(e&f)^(~e&g), t1=(h+S1+ch+K[i]+w[i])|0;
      const S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)), mj=(a&b)^(a&c)^(b&c), t2=(S0+mj)|0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0; H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
function pwHash(pw, salt){ let h = sha256hex(salt+':'+pw); for(let i=0;i<8000;i++) h = sha256hex(h+salt); return h; }
function newSalt(){ const a=new Uint8Array(16); (window.crypto||{getRandomValues:x=>{ for(let i=0;i<x.length;i++) x[i]=Math.floor(Math.random()*256); }}).getRandomValues(a); return [...a].map(x=>x.toString(16).padStart(2,'0')).join(''); }

function authSetSession(u){ AUTH_MEM = u? {u:u.username, h:u.hash} : null; try{ if(u) sessionStorage.setItem('rp_auth', JSON.stringify(AUTH_MEM)); else sessionStorage.removeItem('rp_auth'); }catch(e){} }

function doLogin(e){
  e.preventDefault();

  else { document.getElementById('lg-err').textContent='Wrong user name or password.'; document.getElementById('lg-pass').value=''; }

function createFirstUser(){
  const name=val('u-name').trim(), pw=val('u-pw'), pw2=val('u-pw2');
  const err = userValidate(name,pw,pw2,null,true); if(err){ toast(err,'err'); return; }
  const salt=newSalt(), u={id:uid('user'), username:name, salt, hash:pwHash(pw,salt), role:'admin', created:todayISO()};
  users().push(u); markDirty(); authSetSession(u); renderAll(); toast('Sign-in is now ON. You are signed in as '+name+'.','ok');
}
function userValidate(name,pw,pw2,editId,pwRequired){
  if(name.length<3) return 'User name must be at least 3 characters.';
  if(/\s/.test(name)) return 'User name cannot contain spaces.';
  if(users().some(u=>u.id!==editId && u.username.toLowerCase()===name.toLowerCase())) return 'That user name is already taken.';
  if(pwRequired || pw){ if(pw.length<6) return 'Password must be at least 6 characters.'; if(pw!==pw2) return 'The two passwords do not match.'; }
  return '';
}
function openUserForm(id){
  const u = id? users().find(x=>x.id===id) : null, me = authUser(), own = u && me && u.id===me.id, admin = isAdmin();
  openModal(u? 'Change user name / password' : 'Add user',
    `<div class="field"><label>User name</label><input id="u-name" value="${esc(u?u.username:'')}" autocomplete="off" autocapitalize="none"></div>
     ${own? '<div class="field"><label>Current password</label><input id="u-cur" type="password" autocomplete="current-password"></div>':''}
     <div class="field"><label>${u?'New password (leave blank to keep the current one)':'Password (min 6 characters)'}</label><input id="u-pw" type="password" autocomplete="new-password"></div>
     <div class="field"><label>Repeat password</label><input id="u-pw2" type="password" autocomplete="new-password"></div>
     ${admin? `<div class="field"><label>Access</label><select id="u-role"><option value="staff" ${u&&u.role!=='admin'?'selected':''}>Staff</option><option value="admin" ${(!u||u.role==='admin')&&u?'selected':''}>Admin</option></select></div>`:''}`,
    `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveUser('${id||''}')">Save</button>`);
}
function saveUser(id){
  const u = id? users().find(x=>x.id===id) : null, me = authUser(), own = u && me && u.id===me.id;
  const name=val('u-name').trim(), pw=val('u-pw'), pw2=val('u-pw2');
  const err = userValidate(name,pw,pw2,id||null,!u); if(err){ toast(err,'err'); return; }
  if(own && (pw || name.toLowerCase()!==u.username.toLowerCase())){
    if(pwHash(val('u-cur'),u.salt)!==u.hash){ toast('Current password is not correct.','err'); return; }
  }
  const roleEl = document.getElementById('u-role'), role = roleEl? roleEl.value : (u?u.role:'staff');
  if(u && u.role==='admin' && role!=='admin' && users().filter(x=>x.role==='admin').length<2){ toast('There must be at least one admin.','err'); return; }
  if(u){
    u.username=name; u.role=role;
    if(pw){ u.salt=newSalt(); u.hash=pwHash(pw,u.salt); delete u.defaultPw; }
    else if(own && name!==me.username){ /* hash unchanged, keep session valid */ }
  } else {
    const salt=newSalt(); users().push({id:uid('user'), username:name, salt, hash:pwHash(pw,salt), role, created:todayISO()});
  }
  markDirty(); if(own) authSetSession(u); closeModal(); renderAll(); toast('Saved.','ok');
}
function deleteUser(id){
  const u = users().find(x=>x.id===id); if(!u) return;
  if(u.role==='admin' && users().filter(x=>x.role==='admin').length<2){ toast('You cannot delete the only admin.','err'); return; }
  confirmDelete('Delete user “'+u.username+'”?', ()=>{ DB.users = users().filter(x=>x.id!==id); markDirty(); renderPage(); });
}

   The hosted page holds NO data; everything is loaded from / saved to GitHub.

var CLOUD = {cfg:null, rev:null, loaded:false, status:'off', timer:null, saving:false, again:false, retry:null, poll:null, err:''};
var CLOUD_KEY = 'rp_cloud_cfg3', CLOUD_BAK = 'rp_cloud_unsynced';
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function preset(){ return window.RP_CONFIG || {}; }
function presetGh(){ const g = preset().github||{}, o = {}; ['owner','repo','branch','path'].forEach(k=>{ if(g[k]) o[k]=g[k]; }); return o; }
function cloudLoadCfg(){
  let c = null; try{ c = JSON.parse(lsGet(CLOUD_KEY)||'null'); }catch(e){}
  c = c || {};
  c.github = Object.assign({branch:'main', path:'data.json'}, c.github||{}, presetGh());
  return (c.github.owner && c.github.repo && c.github.token) ? c : null;
}
function cloudSaveCfgStore(){ lsSet(CLOUD_KEY, JSON.stringify(CLOUD.cfg)); }

/* ---- UTF-8 safe base64 (GitHub) ---- */
function b64enc(str){ const b = new TextEncoder().encode(str); let s=''; for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(s); }
function b64dec(b64){ const s = atob(b64.replace(/\s/g,'')); const b = new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i); return new TextDecoder().decode(b); }

/* ---- friendly error text ---- */
function mkErr(msg, status, extra){ const e=new Error(msg); e.status=status; if(extra) Object.assign(e,extra); return e; }
async function netFetch(url, opt){
  try{ return await fetch(url, Object.assign({cache:'no-store'}, opt||{})); }
  catch(e){ throw mkErr('No internet connection.', 0, {offline:true}); }
}
function cloudHuman(e){
  const m = e.message||'';
  if(e.offline) return 'No internet connection. Your changes are kept on this device and will upload when you are online again.';
  if(e.status===401) return 'GitHub says “Bad credentials”: the access token is wrong, incomplete or expired. Create a new token and paste the whole thing (it starts with github_pat_).';
  if(e.status===403 && /rate limit/i.test(m)) return 'GitHub is temporarily limiting requests. Wait a minute and try again.';
  if(e.status===403) return 'GitHub refused this token. Give the token “Contents: Read and write” permission on the data repository.';
  if(e.status===404) return 'GitHub cannot find that repository or file. Check the username, the repository name and that the token was given access to this repository.';
  return m;
}

/* ================= GitHub provider ================= */
function ghBase(){ const c=CLOUD.cfg.github; return 'https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo); }
function ghHeaders(){ return {'Authorization':'Bearer '+CLOUD.cfg.github.token, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'}; }
function ghFileUrl(){ const c=CLOUD.cfg.github; return ghBase()+'/contents/'+c.path.split('/').map(encodeURIComponent).join('/'); }
async function ghErr(r){ let m=''; try{ m=(await r.json()).message||''; }catch(e){} return mkErr('GitHub '+r.status+(m?': '+m:''), r.status); }
async function ghGetFile(){
  const r = await netFetch(ghFileUrl()+'?ref='+encodeURIComponent(CLOUD.cfg.github.branch), {headers:ghHeaders()});
  if(r.status===404) return null;      // file not created yet (repository itself is checked by ghRepoOk)
  if(!r.ok) throw await ghErr(r);
  const j = await r.json(); let text;
  if(j.content && j.encoding==='base64') text = b64dec(j.content);
  else { const br = await netFetch(ghBase()+'/git/blobs/'+j.sha, {headers:ghHeaders()}); if(!br.ok) throw await ghErr(br); text = b64dec((await br.json()).content); }
  return {rev:j.sha, text};
}
async function ghRepoOk(){ const r = await netFetch(ghBase(), {headers:ghHeaders()}); if(r.status===404) throw mkErr('GitHub cannot find the repository “'+CLOUD.cfg.github.owner+'/'+CLOUD.cfg.github.repo+'”. Check the spelling and that the token has access to it.',404); if(!r.ok) throw await ghErr(r); }
async function ghPutFile(text, rev){
  const body = {message:'ERP data '+new Date().toISOString().replace('T',' ').slice(0,19), content:b64enc(text), branch:CLOUD.cfg.github.branch}; if(rev) body.sha = rev;
  const r = await netFetch(ghFileUrl(), {method:'PUT', body:JSON.stringify(body), headers:Object.assign(ghHeaders(),{'Content-Type':'application/json'})});
  if(!r.ok){ const e = await ghErr(r); if(e.status===409||e.status===422) e.status=409; throw e; }
  return (await r.json()).content.sha;
}

/* ================= remote data file ================= */
async function remoteGet(){ return ghGetFile(); }
async function remotePut(text, rev){ return ghPutFile(text, rev); }
async function remotePeekRev(){ const f = await ghGetFile(); return f? f.rev : null; }


/* ---- load DB from cloud text ---- */
function cloudApplyDB(parsed){
  if(!parsed || !parsed.tx || !parsed.meta) throw new Error('this is not a valid ERP data file');
  DB = parsed; _dbv++;
  ensureSchema(); syncExpenseHeads(); ensureDefaultAdmin();
  seqCounter = 1; Object.keys(DB.tx).forEach(k=>DB.tx[k].forEach(r=>{ r._seq = seqCounter++; }));
}
function cloudApplyText(text){ cloudApplyDB(JSON.parse(text)); }
function cloudSerialize(){ return JSON.stringify(DB); }
/* offline files: a backup .html (data inside <script id="app-data">) or a .json export */
function parseDataFile(text){
  if(/<script[^>]*id="app-data"/.test(text)){
    const m = text.match(/<script id="app-data" type="application\/json">([\s\S]*?)<\/script>/);
    if(!m) throw new Error('could not find the data inside this HTML file');
    return JSON.parse(m[1]);
  }
  return JSON.parse(text);
}

/* ---- saving ---- */
function scheduleAutoSave(){
  if(!CLOUD.cfg || !CLOUD.loaded) return;          // never write before the real data has been loaded
  CLOUD.status = CLOUD.saving ? 'saving' : 'pending'; updateSavePill();
  clearTimeout(CLOUD.timer); CLOUD.timer = setTimeout(cloudSave, 1500);
}
async function cloudSave(force){
  if(!CLOUD.cfg || !CLOUD.loaded) return;
  if(CLOUD.saving){ CLOUD.again = true; return; }
  if(!isDirty && !force){ CLOUD.status='synced'; updateSavePill(); return; }
  CLOUD.saving = true; CLOUD.status = 'saving'; updateSavePill();
  const snapshotV = _dbv, text = cloudSerialize();
  try{
    CLOUD.rev = await remotePut(text, CLOUD.rev);
    if(_dbv===snapshotV) isDirty = false;
    CLOUD.status = 'synced'; CLOUD.err=''; lsDel(CLOUD_BAK); clearTimeout(CLOUD.retry);
  }catch(e){
    if(e.status===409){ CLOUD.saving=false; await cloudConflict(); return; }
    CLOUD.err = cloudHuman(e); CLOUD.status = e.offline ? 'offline' : 'error';
    lsSet(CLOUD_BAK, JSON.stringify({base:CLOUD.rev, at:Date.now(), db:DB}));
    clearTimeout(CLOUD.retry); CLOUD.retry = setTimeout(()=>{ cloudSave(true); }, 20000);
    if(!e.offline && (e.status===401||e.status===403||e.code==='expired') && !CLOUD.shownAuthErr){ CLOUD.shownAuthErr=true; setTimeout(()=>openCloudDialog(false), 100); }
  }
  CLOUD.saving = false; updateSavePill();
  if(CLOUD.again){ CLOUD.again=false; if(isDirty) scheduleAutoSave(); }
}
window.addEventListener('online', ()=>{ if(CLOUD.cfg && CLOUD.loaded && isDirty) cloudSave(true); });

}

/* ---- startup / connect ---- */
async function cloudStart(){

async function cloudConnect(fromDialog){
  CLOUD.status = 'loading'; CLOUD.loaded = false; updateSavePill();
  try{
    await ghRepoOk();
    const f = await remoteGet();
    if(!f){ CLOUD.status='seed'; updateSavePill(); cloudOfferSeed(); return; }
    cloudApplyText(f.text); CLOUD.rev = f.rev; CLOUD.loaded = true; isDirty = false; CLOUD.status = 'synced'; CLOUD.shownAuthErr=false;
    const bak = (()=>{ try{ return JSON.parse(lsGet(CLOUD_BAK)||'null'); }catch(e){ return null; } })();
    if(bak && bak.db){
      if(bak.base===f.rev){ cloudApplyDB(bak.db); isDirty=true; toast('Restored unsynced changes from this device — saving them now.','warn'); await cloudSave(true); }
      else { lsDel(CLOUD_BAK); downloadBlob('unsynced-changes-'+todayISO()+'.json', JSON.stringify(bak.db,null,2),'application/json'); toast('Some changes from this device never synced and the cloud has moved on — they were saved to a file in your downloads.','warn'); }
    }
    renderAll();
    if(fromDialog){ closeModal(); toast('Connected. Your data is loaded.','ok'); }
    cloudStartPolling();
  }catch(e){
    CLOUD.err = cloudHuman(e); CLOUD.status = e.offline? 'offline':'error'; updateSavePill();
    openCloudDialog(false, CLOUD.err);
  }
}

function cloudSeedFromFile(inp){
  const f = inp.files[0]; if(!f) return; const rd = new FileReader();
  rd.onload = ()=>{ try{ const p = parseDataFile(rd.result); cloudApplyDB(p); cloudSeedGo('Uploaded '+(DB.tx.expenses.length+DB.tx.cardSales.length+DB.tx.nozzleDiesel.length)+'+ records from “'+f.name+'” to GitHub.'); }

/* pick up changes made on other devices when this screen has nothing unsaved */
function cloudStartPolling(){
  clearInterval(CLOUD.poll);
  const check = async ()=>{
    if(!CLOUD.cfg || !CLOUD.loaded || isDirty || CLOUD.saving || document.hidden) return;
    try{ const rev = await remotePeekRev(); if(rev && rev!==CLOUD.rev && !isDirty){ const f = await remoteGet(); if(f){ cloudApplyText(f.text); CLOUD.rev=f.rev; renderAll(); toast('Updated from the cloud (changed on another device).','ok'); } } }catch(e){}
  };

/* =========================================================

var FS = {mode:'Cash', last:'amt'};
function fsRound(n,d){ const p=Math.pow(10,d); return Math.round((Number(n)||0)*p)/p; }
function fsAllRows(){

}
PAGES['fuel-sale'] = function(el){

  const cashAmt = sum('Cash',amt), credAmt = sum('Credit',amt), cashL = sum('Cash',x=>x.r.qty), credL = sum('Credit',x=>x.r.qty);
  const meterFuel = nozzleSaleAmount('diesel',today) + nozzleSaleAmount('petrol',today);

  el.innerHTML = `

function submitFuelSale(id, again){

  if(rate<=0){ toast('Rate must be greater than zero.','err'); return; }
  let qty, amount = numVal('m-amt');
  if(FS.last==='amt'){ qty = fsRound(amount/rate,9); } else { qty = numVal('m-lit'); }
  if(!(qty>0)){ toast('Enter an amount or litres.','err'); return; }
  const common = {date, qty, rate, costRate: productCostRate(fuel,date), vehicleNo: val('m-vehicle').trim()};
  if(FS.mode==='Credit'){
    if(!DB.customers.length || !val('m-customer')){ toast('Add a customer first (Setup → Customers).','err'); return; }
    const obj = Object.assign({type:fuel, product:fuel, customerId:val('m-customer'), discPct:0, discPerUnit:0, receiptNo:''}, common);
    if(id && FS.editKind==='Credit'){ const old=DB.tx.creditSale.find(r=>r.id===id)||{}; obj.discPct=old.discPct||0; obj.discPerUnit=old.discPerUnit||0; obj.receiptNo=old.receiptNo||''; txUpdate('creditSale',id,obj); }
    else txAdd('creditSale',obj);
  } else {
    if(!DB.tx.cashFuel) DB.tx.cashFuel=[];
    const obj = Object.assign({product:fuel}, common);
    if(id && FS.editKind==='Cash') txUpdate('cashFuel',id,obj); else txAdd('cashFuel',obj);
  }
  toast((FS.mode==='Credit'?'Credit':'Cash')+' sale saved: '+num(qty,2)+' L = '+money(qty*rate),'ok');
  if(again){ const m=FS.mode; renderPage(); openFuelSaleForm('',m); } else { closeModal(); renderPage(); }
}
function deleteFuelSale(id, kind){
  confirmDelete('Delete this fuel sale?', ()=>{ txDelete(kind==='Credit'?'creditSale':'cashFuel', id); renderPage(); });

  function ensureHead(){
    let h = document.getElementById('print-head');
    if(!h){ h = document.createElement('div'); h.id='print-head'; const c=document.getElementById('content'); c.parentNode.insertBefore(h,c); }
    return h;
  }
  function ensureExtra(){
    let x = document.getElementById('print-extra');
    if(!x){ x = document.createElement('div'); x.id='print-extra'; const c=document.getElementById('content'); c.parentNode.insertBefore(x,c); }
    return x;
  }
  function prepPrint(){
    const meta = (typeof PAGE_META!=='undefined' && PAGE_META[currentPage]) || ['Report',''];
    const strip = s=>String(s||'').replace(/<[^>]*>/g,'').replace(/&amp;/g,'&');
    const h = ensureHead();
    // date range shown on the page (From / To pickers) goes into the heading
    const dates = [...document.querySelectorAll('#content input[type=date]')].map(i=>i.value).filter(Boolean);
    const rng = dates.length>=2 ? 'Period: '+fmtDateShort(dates[0])+' to '+fmtDateShort(dates[1]) : (dates.length===1 ? 'Date: '+fmtDateShort(dates[0]) : '');
    const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
    let sub = window._printSub || rng || strip(meta[1]);
    if(!window._printSub && !rng){
      if(currentPage==='monthly-report') sub = 'Month: '+MN[(window._mrMonth||(new Date().getMonth()+1))-1]+' '+(window._mrYear||new Date().getFullYear());
      else if(currentPage==='yearly-report') sub = 'Year: '+(window._yrYear||new Date().getFullYear());
    }
    h.innerHTML = '<img src="'+LOGO+'" alt="">'
      + '<div class="ph-txt"><div class="ph-name">'+esc((DB.meta&&DB.meta.stationName)||'RAZA PETROLEUM SERVICES')+'</div>'
      + '<div class="ph-title">'+esc(window._printTitle||strip(meta[0]))+'</div>'
      + '<div class="ph-sub"><span>'+esc(sub)+'</span><span>Printed: '+new Date().toLocaleString('en-GB')+'</span></div></div>';
    // hide filter / picker cards (inputs, no table) from the printout
    document.querySelectorAll('#content .card').forEach(c=>{ if(c.querySelector('input,select') && !c.querySelector('table')) c.classList.add('np-top'); });
    // hide action columns (✏️ 🗑️) in every table
    document.querySelectorAll('#content table, #print-extra table').forEach(t=>{
      const idx = new Set(); t.querySelectorAll('td.row-actions').forEach(td=>idx.add(td.cellIndex));
      if(!idx.size) return;
      t.querySelectorAll('tr').forEach(tr=>idx.forEach(i=>{ const c=tr.cells[i]; if(c) c.classList.add('np'); }));
    });
    // landscape for wide tables
    let maxCols = 0; document.querySelectorAll('#content table').forEach(t=>{ const r=t.querySelector('tr'); if(r){ const n=[...r.cells].filter(c=>!c.classList.contains('np')).length; if(n>maxCols) maxCols=n; } });
    if(!pageStyle){ pageStyle=document.createElement('style'); document.head.appendChild(pageStyle); }
    pageStyle.textContent = '@page{size:A4 '+(maxCols>7?'landscape':'portrait')+';}';
    window._oldTitle = document.title;
    document.title = strip(meta[0]).replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_') + '_' + todayISO();
  }
  function endPrint(){
    document.querySelectorAll('#content .np, #print-extra .np, #content .np-top').forEach(c=>{ c.classList.remove('np'); c.classList.remove('np-top'); });
    document.body.classList.remove('print-custom'); window._printTitle=null; window._printSub=null;
    if(window._oldTitle) document.title = window._oldTitle;

  /* Customer / Supplier ledger: print the selected party, or every party (one per page) */
  function ledgerHtml(kind, id){
    if(kind==='customer'){ const keep=clSelectedCustomer; clSelectedCustomer=id; renderCustomerDetail(); const h=document.getElementById('cl-detail').innerHTML; clSelectedCustomer=keep; return h; }
    const keep=slSelectedSupplier; slSelectedSupplier=id; renderSupplierDetail(); const h=document.getElementById('sl-detail').innerHTML; slSelectedSupplier=keep; return h;
  }
  function HEAD(title){
    return '<div class="print-hd"><img src="'+LOGO+'" alt=""><div class="ph-txt"><div class="ph-name">'+esc((DB.meta&&DB.meta.stationName)||'RAZA PETROLEUM SERVICES')+'</div><div class="ph-title">'+esc(title)+'</div><div class="ph-sub"><span>Balances as on '+fmtDateShort(todayISO())+'</span><span>Printed: '+new Date().toLocaleString('en-GB')+'</span></div></div></div>';
  }
  window.printLedger = function(kind, all){
    const isC = kind==='customer', list = isC? DB.customers : DB.suppliers;
    if(!list.length){ toast('No '+(isC?'customers':'suppliers')+' to print.','warn'); return; }
    const x = ensureExtra();
    const bals = isC? allCustomerBalances(todayISO()) : allSupplierBalances(todayISO());
    const selId = isC? clSelectedCustomer : slSelectedSupplier;
    let html = '';
    if(all){
      const tot = bals.reduce((s,c)=>s+Math.max(0,c.balance),0);
      html += '<div class="pp-page">'+HEAD(isC?'Customer Ledger — All Balances':'Supplier Ledger — All Balances')+'<div class="pp-title">'+(isC?'All Customers — Balances':'All Suppliers — Balances')+'</div><div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>'+(isC?'Customer':'Supplier')+'</th><th class="num">Balance</th></tr></thead><tbody>'
        + bals.map((c,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(c.name)+'</td><td class="num">'+money(c.balance)+'</td></tr>').join('')
        + '</tbody><tfoot><tr><td></td><td><b>Total '+(isC?'receivable':'payable')+'</b></td><td class="num"><b>'+money(tot)+'</b></td></tr></tfoot></table></div></div></div>';
      list.forEach(p=>{ html += '<div class="pp-page">'+HEAD((isC?'Customer Ledger — ':'Supplier Ledger — ')+p.name)+ledgerHtml(kind,p.id)+'</div>'; });
    } else {
      const sp=list.find(q=>q.id===selId)||list[0]; html = '<div class="pp-page">'+HEAD((isC?'Customer Ledger — ':'Supplier Ledger — ')+sp.name)+ledgerHtml(kind,sp.id)+'</div>';
    }
    x.innerHTML = html;
    document.body.classList.add('print-custom');
    window._printTitle = (isC?'Customer Ledger':'Supplier Ledger')+(all?' — All':'');
    window._printSub = 'Balances as on '+fmtDateShort(todayISO());
    setTimeout(()=>window.print(), 50);
  };

  // button on top of every page
  const _rp = renderPage;
  renderPage = function(){
    _rp();
    if(NOPRINT[currentPage]) return;
    const inner = document.getElementById('page-inner'); if(!inner) return;
    const bar = document.createElement('div'); bar.className='print-bar';
    const led = currentPage==='customer-ledger' ? 'customer' : currentPage==='supplier-ledger' ? 'supplier' : '';
    bar.innerHTML = led
      ? '<button class="btn btn-sm" onclick="printLedger(\''+led+'\',false)">🖨️ Print selected</button> <button class="btn btn-sm btn-primary" style="margin-left:8px" onclick="printLedger(\''+led+'\',true)">🖨️ Print all (PDF)</button>'
      : '<button class="btn btn-sm" onclick="printReport()">🖨️ Print / PDF</button>';
    inner.insertBefore(bar, inner.firstChild);
  };
  // button in the top bar
  const _rt = renderTopbarActions;
  renderTopbarActions = function(){
    _rt();
    const el = document.getElementById('topbar-actions'); if(!el) return;
    const b = document.createElement('button'); b.className='btn btn-icon'; b.title='Print / Save as PDF'; b.textContent='🖨️'; b.onclick=printReport;
    el.insertBefore(b, el.firstChild);
  };
})();
